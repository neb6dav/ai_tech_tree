name: Prepare GitHub Pages release

# RD-006/RD-007 release path: an authorized manual run starts on protected
# main, then checks out and verifies the exact annotated v1.2.0 tag. The
# workflow is intentionally manual and has no arbitrary tag input.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AI_TREE_REQUIRE_CLEAN: "true"
      AI_TREE_AUTHORIZED_TAG: "v1.2.0"

    steps:
      - name: Check out authorized release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/v1.2.0
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Verify annotated tag and protected-main ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$GITHUB_WORKFLOW_REF" = "${GITHUB_REPOSITORY}/.github/workflows/pages.yml@refs/heads/main"
          tag_ref="refs/tags/${AI_TREE_AUTHORIZED_TAG}"
          test "$(git cat-file -t "$tag_ref")" = "tag"
          tag_commit="$(git rev-parse "${tag_ref}^{commit}")"
          test "$tag_commit" = "$(git rev-parse HEAD)"
          git show-ref --verify --quiet refs/remotes/origin/main
          main_commit="$(git rev-parse refs/remotes/origin/main)"
          test "$GITHUB_SHA" = "$main_commit"
          test "$tag_commit" = "$GITHUB_SHA"
          package_version="$(node -p "require('./package.json').version")"
          test "v${package_version}" = "$AI_TREE_AUTHORIZED_TAG"
          echo "AI_TREE_COMMIT_SHA=$tag_commit" >> "$GITHUB_ENV"
          echo "AI_TREE_RELEASE_TAG=$AI_TREE_AUTHORIZED_TAG" >> "$GITHUB_ENV"
          echo "AI_TREE_EXPECT_RELEASE_TAG=$AI_TREE_AUTHORIZED_TAG" >> "$GITHUB_ENV"

      - name: Install exact dependencies
        run: npm ci

      - name: Build generated artifacts
        run: npm run build

      - name: Verify generated artifacts are committed
        shell: bash
        run: |
          git diff --exit-code -- .
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "The build produced untracked files. Refusing to publish an untracked source state."
            git status --short
            exit 1
          fi

      - name: Stage the public artifact
        run: npm run stage:site

      - name: Verify release identity
        run: npm run test:release-identity

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
