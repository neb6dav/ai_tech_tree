name: Prepare GitHub Pages release

# Publication hold: this reusable-only entry point builds a preview artifact
# but has no deployment job. WP-011-B/C4 replaces it with the separately
# authorized annotated-tag promotion path.
on:
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_TREE_REQUIRE_CLEAN: "true"
      AI_TREE_STAGE_MODE: "preview"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Build, validate, and stage the public artifact
        run: |
          npm run build
          npm test
          git diff --exit-code -- .
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "The build produced untracked files. Refusing to publish an untracked source state."
            git status --short
            exit 1
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
