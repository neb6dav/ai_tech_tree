name: Validate public artifact

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test, and verify generated files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_TREE_REQUIRE_CLEAN: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Build generated artifacts
        run: npm run build

      - name: Run validation and staged-site contract gates
        run: npm test

      - name: Verify generated artifacts are committed
        shell: bash
        run: |
          git diff --exit-code -- .
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "The build produced untracked files. Commit all intended generated artifacts."
            git status --short
            exit 1
          fi

      - name: Upload staged-site preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview-${{ github.sha }}
          path: _site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
