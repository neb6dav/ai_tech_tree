<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The AI Research Tech Tree · 1900–2026</title>
<meta name="description" content="An interactive, source-backed map of AI research history, active frontiers, specialist branches and open research directions from 1900 to 2026.">
<meta name="theme-color" content="#0a0d12">

<meta name="twitter:title" content="The AI Research Tech Tree · 1900–2026">

<style>
  :root{
    --bg:#0a0d12; --surface:#0e1117; --panel:#141926; --panel2:#1a2030;
    --ink:#e6eaf2; --ink2:#9aa4b8; --ink3:#5c6578;
    --line:#232a3a; --hair:rgba(255,255,255,.07);
    --bar-top:#10141d; --bar-bottom:#0d1017; --panel-top:#161c2a; --panel-bottom:#121724;
    --tooltip:#1b2130; --tooltip-line:#2e3852; --subtle-text:#bcc6d8;
    --hud-fade:rgba(10,13,18,.92); --lane-fade:rgba(10,13,18,.9);
    --era-band:rgba(255,255,255,.012); --lane-band:rgba(148,163,190,.028);
    --era-line:rgba(148,163,190,.10); --lane-line:rgba(148,163,190,.06);
    --node-label:#dbe3ee; --mini-bg:#0c0f15; --stats-top:#0b0e14; --stats-bottom:#0d1017;
    --shadow:rgba(0,0,0,.55); --focus:#8fc7ff;
    --c-f:#78818e; --c-a:#2b8fd6; --c-h:#3fd08f; --c-d:#eaa221; --c-x:#ef5350; --c-r:#f591d9; --c-g:#d7dee9;
    --e-in:#5b9be0; --e-out:#3fd08f; --e-sup:#ef5350; --e-gap:#aab6c8; --e-ctx:#3a4356;
  }
  body[data-theme="light"]{
    color-scheme:light;
    --bg:#eef2f7; --surface:#f8fafc; --panel:#ffffff; --panel2:#e8edf5;
    --ink:#182235; --ink2:#526078; --ink3:#758198; --line:#cbd4e1; --hair:rgba(24,34,53,.11);
    --bar-top:#ffffff; --bar-bottom:#f1f4f8; --panel-top:#ffffff; --panel-bottom:#f4f7fb;
    --tooltip:#ffffff; --tooltip-line:#bcc8d8; --subtle-text:#3f4e67;
    --hud-fade:rgba(248,250,252,.95); --lane-fade:rgba(248,250,252,.93);
    --era-band:rgba(58,74,104,.035); --lane-band:rgba(58,74,104,.045);
    --era-line:rgba(58,74,104,.16); --lane-line:rgba(58,74,104,.10);
    --node-label:#182235; --mini-bg:#f6f8fb; --stats-top:#e9eef5; --stats-bottom:#f8fafc;
    --shadow:rgba(30,42,62,.18); --focus:#005ea8;
    --c-f:#56616f; --c-a:#176daa; --c-h:#087747; --c-d:#965d00; --c-x:#c73532; --c-r:#963b87; --c-g:#455468;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{width:100%;height:100%;overflow:hidden}
  body{background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:13px; color-scheme:dark}
  button,input,select{font:inherit}
  button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
  #stage{position:fixed; inset:0; top:52px; background:var(--surface); cursor:grab; touch-action:none}
  #stage.panning{cursor:grabbing}
  svg{width:100%; height:100%; display:block; user-select:none}

  /* ---------- toolbar ---------- */
  #bar{position:fixed; top:0; left:0; right:0; height:52px; background:linear-gradient(180deg,var(--bar-top),var(--bar-bottom)); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; padding:0 12px; z-index:80; flex-wrap:nowrap}
  #title{font-weight:650; font-size:14px; letter-spacing:.2px; white-space:nowrap; display:flex; align-items:center; gap:8px}
  #title .dot{width:9px;height:9px;border-radius:3px;background:linear-gradient(135deg,var(--c-h),var(--c-a)); display:inline-block}
  #title small{color:var(--ink2); font-weight:400}
  #title .titleShort{display:none}
  #controls{display:flex; align-items:center; gap:10px; min-width:0; flex:1}
  #controlsBtn{display:none; margin-left:auto}
  .grp{display:flex; align-items:center; gap:6px; white-space:nowrap}
  .seg{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden}
  .seg button{background:transparent; color:var(--ink2); border:0; padding:7px 11px; min-height:34px; font-size:12px; cursor:pointer; font-family:inherit}
  .seg button.on{background:var(--panel2); color:var(--ink)}
  .seg button:not(:last-child){border-right:1px solid var(--line)}
  .btn{background:var(--panel); color:var(--ink2); border:1px solid var(--line); border-radius:8px; padding:7px 10px; min-height:34px; font-size:12px; cursor:pointer; font-family:inherit; white-space:nowrap}
  .btn:hover{color:var(--ink); border-color:#33405c}
  .btn.on{background:var(--panel2); color:var(--ink); border-color:#3c4c6e}
  .lbl{color:var(--ink2); font-size:11px; text-transform:uppercase; letter-spacing:.6px}
  #search{position:relative; flex:0 1 300px; min-width:170px}
  #search input{background:var(--panel); border:1px solid var(--line); border-radius:8px; color:var(--ink); padding:8px 10px 8px 28px; width:100%; font-size:12.5px; font-family:inherit; outline:none}
  #search input:focus{border-color:#3c4c6e}
  #search .mag{position:absolute; left:9px; top:6px; color:var(--ink2); font-size:13px; pointer-events:none}
  #results{position:absolute; top:40px; left:0; width:min(360px,calc(100vw - 24px)); max-height:380px; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:10px; display:none; z-index:60; box-shadow:0 12px 30px var(--shadow)}
  #results .res{display:block; width:100%; text-align:left; color:var(--ink); background:transparent; border:0; padding:9px 10px; cursor:pointer; border-bottom:1px solid var(--hair)}
  #results .res:hover,#results .res.active{background:var(--panel2)}
  #results .res b{font-weight:600; font-size:12.5px}
  #results .res .sub{display:block; color:var(--ink2); font-size:11px; margin-top:2px; line-height:1.35}
  #results .empty{padding:12px; color:var(--ink2); font-size:12px}
  .chip{display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line); border-radius:20px; padding:6px 9px; min-height:34px; cursor:pointer; font-size:11.5px; color:var(--ink2); background:transparent; font-family:inherit}
  .chip .sw{width:8px; height:8px; border-radius:2px}
  .chip.on{color:var(--ink); background:var(--panel2)}
  .chip.off{opacity:.38}
  .auditFilterWrap,.researchFilterWrap{display:flex; align-items:center; gap:6px; white-space:nowrap}
  #auditFilter,#researchFilter{min-height:34px; max-width:184px; border:1px solid var(--line); border-radius:8px; padding:6px 28px 6px 8px; background:var(--panel); color:var(--ink); font-size:11.5px; cursor:pointer}

  /* ---------- HUD era / lane ---------- */
  #eraHud{position:fixed; top:52px; left:0; right:0; height:38px; z-index:20; pointer-events:none; overflow:hidden; background:linear-gradient(180deg,var(--hud-fade),transparent)}
  .eraTag{position:absolute; top:4px; color:var(--ink2); font-size:11px; font-weight:600; font-family:inherit; letter-spacing:.4px; white-space:nowrap; pointer-events:auto; cursor:pointer; padding:3px 8px; border:0; background:transparent; border-radius:6px}
  .eraTag:hover{background:var(--panel2); color:var(--ink)}
  .eraTag small{color:#5c6578; font-weight:500; margin-left:6px}
  #laneHud{position:fixed; top:52px; left:0; bottom:0; width:300px; z-index:20; pointer-events:none; overflow:hidden}
  .laneTag{position:absolute; left:0; padding:3px 10px 3px 12px; font-size:11px; font-weight:600; color:var(--ink2); background:linear-gradient(90deg,var(--lane-fade) 60%,transparent); border-left:3px solid var(--line); white-space:nowrap; letter-spacing:.3px}
  .laneTag.sm{font-size:8.5px; padding:1px 8px 1px 10px; letter-spacing:.2px}

  /* ---------- map elements ---------- */
  .eraBand{fill:var(--era-band)}
  .eraLine{stroke:var(--era-line); stroke-width:1}
  .laneBand{fill:var(--lane-band)}
  .laneLine{stroke:var(--lane-line); stroke-width:1}
  .laneTitleWorld{fill:#39415a; font-size:13px; font-weight:700; letter-spacing:1px}
  .eraTitleWorld{fill:#333c55; font-size:26px; font-weight:800; letter-spacing:1px}

  g.node{cursor:pointer}
  g.node rect.hit{fill:transparent; stroke:none; pointer-events:all}
  g.node:focus{outline:none}
  g.node rect.box{rx:7; stroke-width:1.3}
  g.node text.nlabel{font-size:12px; font-weight:500; fill:var(--node-label); pointer-events:none}
  g.node text.nlabel .gl{font-weight:700}
  g.node circle.ndot{display:none; stroke:rgba(10,13,18,.6); stroke-width:1}
  svg.far g.node rect.box, svg.far g.node text.nlabel{display:none}
  svg.far g.node circle.ndot{display:block}
  g.node.gapn rect.box{stroke-dasharray:5 4}
  g.node.gapn text.nlabel{font-style:italic}

  #nodes.hovering g.node{opacity:.13; transition:opacity .12s}
  #nodes.hovering g.node.lit{opacity:1}
  #nodes.filtering g.node.fout{display:none; pointer-events:none}
  g.node.focus rect.box,g.node:focus rect.box{stroke-width:2.4; filter:drop-shadow(0 0 6px color-mix(in srgb,var(--focus) 55%,transparent))}
  svg.far g.node:focus circle.ndot,svg.far g.node.focus circle.ndot{stroke:var(--focus);stroke-width:3}

  #edgesAll path{fill:none; stroke:var(--e-ctx); opacity:.35}
  #edgesAll path.sup{stroke:var(--e-sup); stroke-dasharray:3 4; opacity:.3}
  #edgesAll path.gap{stroke:var(--e-gap); stroke-dasharray:2 5; opacity:.25}
  #edgesAll.dimAll path{opacity:.05}
  #edgesHi path{fill:none; opacity:.95}
  #edgesHi path.in{stroke:var(--e-in)}
  #edgesHi path.out{stroke:var(--e-out)}
  #edgesHi path.sup{stroke:var(--e-sup); stroke-dasharray:4 4}
  #edgesHi path.gap{stroke:var(--e-gap); stroke-dasharray:3 5}

  /* ---------- tooltip ---------- */
  #tip{position:fixed; display:none; background:var(--tooltip); border:1px solid var(--tooltip-line); border-radius:9px; padding:9px 11px; max-width:min(320px,calc(100vw - 20px)); z-index:70; pointer-events:none; box-shadow:0 10px 26px var(--shadow)}
  #tip .tt{font-weight:650; font-size:12.5px; margin-bottom:2px}
  #tip .ts{font-size:11px; color:var(--ink2)}
  #tip .td{font-size:12px; color:var(--subtle-text); margin-top:5px; line-height:1.5}
  #tip .ta{font-size:10.8px; color:var(--ink2); margin-top:5px; padding-top:5px; border-top:1px solid var(--hair)}

  /* ---------- detail panel ---------- */
  #panel{position:fixed; top:60px; right:10px; width:min(360px,calc(100vw - 20px)); max-height:calc(100% - 118px); background:linear-gradient(180deg,var(--panel-top),var(--panel-bottom)); border:1px solid var(--line); border-radius:14px; z-index:50; display:none; flex-direction:column; box-shadow:0 18px 44px var(--shadow)}
  #panel.open{display:flex}
  #panelHead{padding:14px 16px 10px; border-bottom:1px solid rgba(255,255,255,.06)}
  #panelHead .close{position:absolute; top:10px; right:12px; background:none; border:0; color:var(--ink2); font-size:16px; cursor:pointer}
  #panelHead .close:hover{color:var(--ink)}
  #pTitle{font-size:15.5px; font-weight:700; padding-right:22px; line-height:1.3}
  #pMeta{display:flex; gap:8px; align-items:center; margin-top:7px; flex-wrap:wrap}
  .badge{font-size:10.8px; padding:3px 8px; border-radius:12px; border:1px solid var(--line); color:var(--ink2); font-weight:600; letter-spacing:.3px}
  #pBody{padding:12px 16px 16px; overflow-y:auto}
  #pDesc{font-size:13.2px; line-height:1.58; color:var(--subtle-text)}
  .pSec{margin-top:13px}
  .pSec h4{font-size:10.5px; text-transform:uppercase; letter-spacing:.8px; color:var(--ink2); margin-bottom:6px; display:flex; align-items:center; gap:6px}
  .pSec h4 .ln{display:inline-block; width:14px; height:2px; border-radius:2px}
  .rel{display:block; width:100%; text-align:left; background:var(--panel); border:1px solid var(--line); color:var(--subtle-text); border-radius:8px; padding:5px 9px; margin-bottom:4px; cursor:pointer; font-size:12px; font-family:inherit; line-height:1.35}
  .rel:hover{border-color:#3c4c6e; color:var(--ink)}
  .rel small{color:var(--ink2)}
  .relWrap{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 6px; align-items:stretch; margin-bottom:5px}
  .relWrap .rel{margin-bottom:0}
  .edgeAudit{display:flex; align-items:center; justify-content:center; min-width:88px; border:1px solid var(--line); border-radius:8px; padding:4px 7px; color:var(--ink2); background:var(--panel2); font-size:10.5px; line-height:1.2; text-decoration:none; text-align:center}
  a.edgeAudit:hover{color:var(--ink); border-color:#3c4c6e}
  .edgeNote{grid-column:1/-1; color:var(--ink2); font-size:10.8px; line-height:1.4; padding:0 4px 2px}
  .sinkNote{color:var(--ink2); font-size:11.5px; line-height:1.45; padding:7px 9px; border:1px dashed var(--line); border-radius:8px; background:var(--panel)}
  #pActions{display:flex; flex-wrap:wrap; gap:7px; margin-top:14px}
  #pActions .btn{flex:1; text-align:center}

  /* ---------- legend / help ---------- */
  #legend{position:fixed; left:12px; bottom:40px; width:min(370px,calc(100vw - 24px)); background:linear-gradient(180deg,var(--panel-top),var(--panel-bottom)); border:1px solid var(--line); border-radius:14px; z-index:45; padding:16px; display:none; box-shadow:0 18px 44px var(--shadow); max-height:calc(100% - 110px); overflow-y:auto}
  #legend.open{display:block}
  #legend h3{font-size:13.5px; margin-bottom:4px}
  #legend .sub{color:var(--ink2); font-size:11.8px; line-height:1.5; margin-bottom:10px}
  .lgRow{display:flex; align-items:flex-start; gap:9px; padding:3.5px 0; font-size:12px}
  .lgRow .sw{flex:0 0 auto; width:14px; height:14px; border-radius:4px; margin-top:1px; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:800; color:#0a0d12}
  .lgRow .nm{font-weight:600}
  .lgRow .ct{color:var(--ink2); margin-left:4px; font-weight:400}
  .lgRow .ds{color:var(--ink2); font-size:11px; line-height:1.4}
  .lgEdge{display:flex; align-items:center; gap:9px; padding:3px 0; font-size:11.5px; color:var(--subtle-text)}
  .lgEdge .el{flex:0 0 26px; height:0; border-top:2px solid}
  .lgEdge .el.dash{border-top-style:dashed}
  #legend .keys{margin-top:10px; padding-top:10px; border-top:1px solid rgba(255,255,255,.07); color:var(--ink2); font-size:11.4px; line-height:1.65}
  #legend .keys b{color:var(--ink); font-weight:600}
  #legend .gotit{margin-top:10px; width:100%}

  /* ---------- minimap ---------- */
  #miniWrap{position:fixed; right:12px; bottom:40px; z-index:30; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--mini-bg); box-shadow:0 10px 30px var(--shadow); cursor:pointer; transition:right .2s,opacity .2s}
  body.panel-open #miniWrap{right:382px}
  #mini{display:block}

  /* ---------- stats ---------- */
  #stats{position:fixed; left:0; right:0; bottom:0; height:28px; background:linear-gradient(0deg,var(--stats-top),var(--stats-bottom)); border-top:1px solid var(--line); display:flex; align-items:center; gap:16px; padding:0 14px; font-size:11px; color:var(--ink2); z-index:35; white-space:nowrap; overflow:hidden}
  #stats b{color:var(--ink); font-weight:600}
  #zoomPct{margin-left:auto}
  .startActions{display:grid; grid-template-columns:1fr 1fr; gap:7px; margin:10px 0}
  .startActions .wide{grid-column:1/-1}
  .provenance{margin-top:13px; padding:10px; border:1px solid var(--line); border-radius:9px; background:var(--panel); color:var(--ink2); font-size:11.5px; line-height:1.45}
  .provenance strong{color:var(--ink)}
  .auditBlock{display:grid; gap:7px}
  .auditLine{display:grid; grid-template-columns:minmax(88px,auto) 1fr; gap:5px 8px; align-items:start}
  .auditLabel{color:var(--ink); font-weight:650}
  .auditValue{display:flex; flex-wrap:wrap; align-items:center; gap:5px}
  .auditBadge{display:inline-flex; align-items:center; border:1px solid currentColor; border-radius:12px; padding:2px 7px; font-size:10.5px; font-weight:700; line-height:1.25}
  .audit-confirmed{color:var(--e-out)}
  .audit-partial{color:var(--c-d)}
  .audit-indirect{color:var(--e-in)}
  .audit-conflict{color:var(--e-sup)}
  .audit-not_found,.audit-not_assessed{color:var(--ink2)}
  .audit-editorial_only{color:var(--c-r)}
  .audit-hypothesis{color:var(--c-g)}
  .auditConfidence{color:var(--ink2); font-size:10.8px}
  .auditNote{grid-column:2; color:var(--subtle-text); font-size:11px; line-height:1.45}
  .auditLimits{border-top:1px solid var(--hair); padding-top:6px}
  .auditLimits summary{cursor:pointer; color:var(--ink); font-weight:600}
  .auditLimits p{margin-top:5px; color:var(--ink2)}
  .sourceActions .sourceNote{width:100%; color:var(--ink2); font-size:11px}
  .sourceHeading{width:100%; color:var(--ink); font-size:10.5px; font-weight:750; text-transform:uppercase; letter-spacing:.65px; margin-top:5px}
  .researchBlock{display:none}
  .researchBlock.open{display:block}
  .researchBlock .researchTier{display:inline-flex; margin:6px 0 8px; padding:2px 7px; border:1px solid var(--line); border-radius:999px; color:var(--ink); font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.5px}
  .researchBlock ul{margin:6px 0 0 18px; color:var(--subtle-text)}
  .researchBlock li+li{margin-top:5px}
  .researchTags{display:flex; flex-wrap:wrap; gap:5px; margin-top:7px}
  .researchTag{padding:2px 7px; border-radius:999px; background:var(--panel2); color:var(--ink2); font-size:10.5px}
  .primaryBadge{border-color:var(--e-in); color:var(--e-in)}
  .auditSummary{margin-top:10px; padding-top:10px; border-top:1px solid var(--hair)}
  .auditSummary summary{cursor:pointer; color:var(--ink); font-weight:650; font-size:12px}
  .auditSummary .auditScope{margin-top:7px; color:var(--ink2); font-size:11px; line-height:1.45}
  .auditSummary h4{margin-top:8px; color:var(--ink); font-size:10.8px; text-transform:uppercase; letter-spacing:.6px}
  .auditSummary dl{display:grid; grid-template-columns:1fr auto; gap:3px 10px; margin-top:4px; color:var(--ink2); font-size:11px}
  .auditSummary dd{color:var(--ink); font-variant-numeric:tabular-nums; text-align:right}
  .auditSummary .auditWarning{margin-top:8px; padding:7px 8px; border:1px solid var(--c-d); border-radius:7px; color:var(--ink2); font-size:10.8px; line-height:1.4}
  .auditSummary .auditClean{margin-top:8px; color:var(--e-out); font-size:10.8px}
  .sourceActions{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
  .sourceActions a{color:var(--ink); text-decoration:none; border:1px solid var(--line); border-radius:7px; padding:5px 8px; background:var(--panel2); max-width:100%; overflow-wrap:anywhere; line-height:1.35}
  #toast{position:fixed; left:50%; bottom:42px; transform:translate(-50%,12px); z-index:90; background:var(--ink); color:var(--bg); padding:8px 12px; border-radius:8px; font-size:12px; font-weight:650; opacity:0; pointer-events:none; transition:opacity .18s,transform .18s}
  #toast.show{opacity:1; transform:translate(-50%,0)}
  .sr-only{position:absolute!important; width:1px!important; height:1px!important; padding:0!important; margin:-1px!important; overflow:hidden!important; clip:rect(0,0,0,0)!important; white-space:nowrap!important; border:0!important}
  body[data-theme="light"] g.node rect.box{filter:saturate(.92) brightness(.82)}
  body[data-theme="light"] g.node.focus rect.box,body[data-theme="light"] g.node:focus rect.box{filter:saturate(.92) brightness(.82) drop-shadow(0 0 5px rgba(0,94,168,.35))}
  body[data-theme="light"] .lgRow .nm,body[data-theme="light"] .badge{filter:brightness(.68) saturate(1.1)}
  body[data-theme="light"]{--e-in:#1f66a8;--e-out:#087747;--e-sup:#b52d2a;--e-gap:#56657a;--e-ctx:#738198}

  @media (max-width:1500px){
    #bar{gap:8px}
    #title small{display:none}
    #search{flex:1 1 280px}
    #controlsBtn{display:inline-flex; align-items:center}
    #controls{display:none; position:fixed; top:58px; right:8px; width:min(430px,calc(100vw - 16px)); max-height:calc(100vh - 98px); overflow:auto; padding:12px; border:1px solid var(--line); border-radius:12px; background:linear-gradient(180deg,var(--panel-top),var(--panel-bottom)); box-shadow:0 16px 38px var(--shadow); align-items:stretch; flex-direction:column}
    #controls.open{display:flex}
    #controls>.grp,#chips{flex-wrap:wrap; white-space:normal}

<script>
const NODES = [];
const P = (...n) => NODES.push(...n);
/* ============ ROOTS: MATH, NEURO & CYBERNETICS ============ */
P(
{"id":"markov","t":"Markov chains","y":1913,"lane":"roots","s":"f","d":"Statistical models of state-to-state transitions. The mathematical seed of language modeling, HMMs and reinforcement learning's state formalism.","deps":[]},
{"id":"logicprog","t":"Formal logic program (Frege→Hilbert)","y":1928,"lane":"roots","s":"f","d":"The project of reducing reasoning to symbol manipulation. Made 'thinking machines' conceivable before computers existed.","deps":[]},
{"id":"godel","t":"Gödel incompleteness","y":1931,"lane":"roots","s":"f","d":"Formal systems can't prove all truths about themselves. Framed the limits — and licensed the mechanization — of reasoning.","deps":["logicprog"]},
{"id":"turing36","t":"Turing machine","y":1936,"lane":"roots","s":"f","d":"Computation formalized: one simple machine can compute anything computable. Every AI system is an instance.","deps":["logicprog","godel"]},
{"id":"shannon37","t":"Boolean circuits (Shannon's thesis)","y":1937,"lane":"roots","s":"f","d":"Switching circuits implement logic. The bridge from abstract symbols to physical hardware.","deps":["logicprog"]},
{"id":"mcculloch43","t":"McCulloch–Pitts neuron","y":1943,"lane":"roots","s":"f","d":"The first formal neuron: logic realized in idealized brain cells. Root of every neural network on this map.","deps":["turing36","logicprog"]},
{"id":"gametheory","t":"Game theory (von Neumann–Morgenstern)","y":1944,"lane":"roots","s":"f","d":"Strategic rationality formalized. Underpins multi-agent AI, GANs, poker solvers and mechanism design.","deps":[]},
{"id":"vonneumann45","t":"Stored-program computer","y":1945,"lane":"roots","s":"f","d":"General-purpose hardware — the substrate every idea on this map runs on. Also the 'von Neumann bottleneck' later hardware tries to escape.","deps":["turing36"]},
{"id":"wiener48","t":"Cybernetics (Wiener)","y":1948,"lane":"roots","s":"f","d":"Feedback, control and communication in animal and machine. Seeded AI, control theory, robotics and the first misalignment worries.","deps":["mcculloch43"]},
{"id":"shannon48","t":"Information theory","y":1948,"lane":"roots","s":"f","d":"Information quantified; prediction and compression unified. The deep reason language modeling works at all.","deps":["markov","shannon37"]},
{"id":"hebb49","t":"Hebbian learning","y":1949,"lane":"roots","s":"f","d":"'Cells that fire together wire together' — the first learning rule, still echoed in every weight update and in biologically-plausible learning research.","deps":["mcculloch43"]},
{"id":"turingtest","t":"Turing test","y":1950,"lane":"roots","s":"f","d":"'Computing Machinery and Intelligence' reframed 'can machines think?' as an imitation game. The field's north star and favorite argument.","deps":["turing36"]},
{"id":"hodgkin52","t":"Hodgkin–Huxley neuron model","y":1952,"lane":"roots","s":"f","d":"The biophysics of the spike, measured and modeled. Ground truth for spiking networks and neuromorphic silicon.","deps":[]},
{"id":"dartmouth","t":"Dartmouth workshop — 'AI' named","y":1956,"lane":"roots","s":"f","d":"McCarthy, Minsky, Shannon, Rochester bet a summer could crack intelligence. Wrong on timing, right on ambition — the field's founding myth.","deps":["turingtest","wiener48"]},
{"id":"cogrev","t":"Cognitive revolution","y":1956,"lane":"roots","s":"f","d":"Miller, Chomsky, Newell & Simon recast mind as information processing. Psychology and AI were born entangled.","deps":["shannon48","turingtest"]},
{"id":"hubel59","t":"Hubel & Wiesel visual cortex","y":1959,"lane":"roots","s":"f","d":"Orientation-selective cells stacked in layers — the biological blueprint later copied by the neocognitron and CNNs.","deps":["hebb49"]},
{"id":"solomonoff","t":"Solomonoff induction","y":1964,"lane":"roots","s":"f","d":"Universal prediction by weighting all programs by simplicity. The idealized learner behind AIXI and compression-based views of intelligence.","deps":["shannon48","turing36"]},
{"id":"kolmo","t":"Kolmogorov complexity & MDL","y":1965,"lane":"roots","s":"f","d":"Learning as compression, formalized. Quietly resurfaces in every era — most recently in 'compression is intelligence' scaling arguments.","deps":["shannon48","turing36"]},
{"id":"complexity71","t":"NP-completeness (Cook–Karp)","y":1971,"lane":"roots","s":"f","d":"Which problems are intractable. Explains why naive search-based AI hit walls — and why heuristics and learning are necessary.","deps":["turing36"]},
{"id":"chineseroom","t":"Chinese Room & symbol grounding","y":1980,"lane":"roots","s":"f","d":"Searle: syntax isn't semantics. The grounding critique haunted symbolic AI; multimodal, embodied learning is the modern rebuttal-in-progress.","deps":["turingtest"]},
{"id":"conndebate","t":"Symbolic vs connectionist war","y":1988,"lane":"roots","s":"f","d":"Fodor & Pylyshyn: can networks compose meaning? The systematicity debate — reopened, not settled, by LLM reasoning.","deps":["pdp86","chomsky"]},
{"id":"freeenergy","t":"Free-energy principle","y":2005,"lane":"roots","s":"a","d":"Friston: brains minimize prediction error. Grand, contested, hard to operationalize — the neuroscience shadow of world-model AI.","deps":["wiener48","bayesnets"]},
{"id":"gap_activeinf","t":"Active inference at scale","y":2026,"lane":"roots","s":"g","d":"Neuroscience's grandest theory of agency has never been industrialized. Nobody has built a frontier-scale agent on prediction-error minimization.","deps":["freeenergy","modelbased"]}
);
/* ============ SYMBOLIC AI & KNOWLEDGE ============ */
P(
{"id":"lt56","t":"Logic Theorist","y":1956,"lane":"symbolic","s":"f","d":"Newell & Simon's first AI program — proved theorems from Principia by heuristic search over symbols. AI's opening move.","deps":["dartmouth","logicprog"]},
{"id":"lisp","t":"LISP","y":1958,"lane":"symbolic","s":"f","d":"McCarthy's symbolic language: code as data, recursion, garbage collection. AI's native tongue for 30 years.","deps":["dartmouth"]},
{"id":"gps","t":"General Problem Solver","y":1959,"lane":"symbolic","s":"f","d":"Means–ends analysis as a theory of thought. 'General' proved elusive beyond puzzles — but it seeded planning and cognitive architectures.","deps":["lt56","cogrev"]},
{"id":"advicetaker","t":"Advice Taker & the logicist creed","y":1959,"lane":"symbolic","s":"f","d":"McCarthy's program: represent knowledge as logical sentences, act by deduction. The purist wing of symbolic AI.","deps":["lisp","logicprog"]},
{"id":"resolution","t":"Resolution theorem proving","y":1965,"lane":"symbolic","s":"f","d":"Robinson's single complete inference rule made automated deduction real — and revealed combinatorial explosion as the enemy.","deps":["advicetaker"]},
{"id":"dendral","t":"DENDRAL — first expert system","y":1965,"lane":"symbolic","s":"f","d":"Mass-spectrometry chemistry via encoded expertise. Proved domain knowledge beats general search — the knowledge turn begins.","deps":["lt56"]},
{"id":"semanticnets","t":"Semantic networks","y":1966,"lane":"symbolic","s":"f","d":"Quillian's concepts-as-graphs. Ancestor of frames, ontologies, knowledge graphs — and, arguably, of embeddings-as-relations.","deps":["cogrev"]},
{"id":"shrdlu","t":"SHRDLU & blocks world","y":1970,"lane":"symbolic","s":"x","d":"Winograd's dazzling language-plus-planning demo in a toy world. Famously refused to scale — the archetype of the demo-to-world gap.","deps":["lt56","chomsky"]},
{"id":"prolog","t":"Prolog & logic programming","y":1972,"lane":"symbolic","s":"d","d":"Computation as deduction. Once a national strategy (Japan bet on it); now a respected niche in verification, Datalog and answer-set programming.","deps":["resolution"]},
{"id":"lighthill","t":"Lighthill Report → first AI winter","y":1973,"lane":"symbolic","s":"x","d":"UK review damning AI's unmet promises; with DARPA cuts it froze funding for a decade. The field's first reckoning with its own hype.","deps":["shrdlu","perceptronsbook"]},
{"id":"mycin","t":"MYCIN","y":1974,"lane":"symbolic","s":"x","d":"Rule-based infection diagnosis that rivaled experts — and was never deployed (liability, integration, trust). The expert-system template and its fate in one system.","deps":["dendral"]},
{"id":"frames","t":"Frames (Minsky)","y":1974,"lane":"symbolic","s":"f","d":"Structured slots and defaults for commonsense knowledge. Ancestor of objects, schemas, ontologies — and of every 'context' hack since.","deps":["semanticnets"]},
{"id":"ameurisko","t":"AM & EURISKO","y":1976,"lane":"symbolic","s":"d","d":"Lenat's discovery programs invented concepts, won wargame tournaments — then 'ran out of steam.' Their post-mortem led him to Cyc.","deps":["gps"]},
{"id":"blackboard","t":"Blackboard architectures","y":1980,"lane":"symbolic","s":"d","d":"HEARSAY-II's shared-workspace coordination of specialist modules. Faded — yet echoes in every multi-agent orchestration framework today.","deps":["gps"]},
{"id":"xcon","t":"XCON at DEC","y":1980,"lane":"symbolic","s":"x","d":"Configured VAX orders with 10,000+ rules, saved ~$40M/yr — then drowned in rule-maintenance. The boom's flagship and its cautionary tale.","deps":["mycin"]},
{"id":"nonmono","t":"Non-monotonic logic & frame problem","y":1980,"lane":"symbolic","s":"d","d":"Formalizing defeasible commonsense reasoning. Elegant logics, endless workshops — the frame problem was never solved, just bypassed by learning.","deps":["advicetaker","frames"]},
{"id":"expertshells","t":"Expert-systems industry","y":1981,"lane":"symbolic","s":"x","d":"Shells, consultancies, and knowledge engineers turned expert systems into an industry. Lisp-machine workstations helped enable the boom; brittle rules and costly upkeep helped collapse it by 1990.","deps":["mycin","xcon","lispmachines"]},
{"id":"lispmachines","t":"Lisp machines","y":1980,"lane":"symbolic","s":"x","d":"A whole hardware industry (Symbolics, LMI) for symbolic AI — wiped out by commodity workstations by 1987. Hardware bet on a software fad.","deps":["lisp"]},
{"id":"fifthgen","t":"Fifth Generation Project","y":1982,"lane":"symbolic","s":"x","d":"Japan's $850M national bet on massively parallel logic programming. Delivered little; its shadow scared funders worldwide for a decade.","deps":["prolog"]},
{"id":"soar","t":"SOAR & ACT-R architectures","y":1983,"lane":"symbolic","s":"d","d":"Unified theories of cognition with dedicated labs for decades — marginal to modern AI, but a likely quarry for LLM-agent memory design.","deps":["gps"]},
{"id":"cbr","t":"Case-based reasoning","y":1983,"lane":"symbolic","s":"d","d":"Solve new problems by adapting stored cases. A thriving 90s subfield that faded to niche — conceptually reborn as retrieval-augmented everything.","deps":["frames"]},
{"id":"cyc","t":"Cyc — commonsense by hand","y":1984,"lane":"symbolic","s":"d","d":"Lenat's 40-year, million-axiom quest to hand-encode common sense. The grandest knowledge-engineering grind; still no general reasoner emerged.","deps":["frames","ameurisko"]},
{"id":"aiwinter2","t":"Second AI winter","y":1988,"lane":"symbolic","s":"x","d":"Expert-system market collapse plus Lisp-machine crash. 'AI' became a dirty word; survivors rebranded as 'machine learning.'","deps":["expertshells","lispmachines","fifthgen"]},
{"id":"itp","t":"Interactive theorem provers","y":1989,"lane":"symbolic","s":"r","d":"Coq→Isabelle→Lean: humans and machines formalizing mathematics. A quiet community for 30 years — now the verification substrate for AI mathematicians.","deps":["resolution"]},
{"id":"ilp","t":"Inductive logic programming","y":1991,"lane":"symbolic","s":"d","d":"Learning logic rules from examples. Elegant, interpretable, data-inefficient — sidelined by statistical ML; small revival alongside program synthesis.","deps":["prolog","dtrees"]},
{"id":"dlogic","t":"Description logics & ontologies","y":1991,"lane":"symbolic","s":"d","d":"Decidable fragments of logic for taxonomies; became OWL. Industrial ontology work persists; the research frontier moved on.","deps":["semanticnets","frames"]},
{"id":"fuzzy","t":"Fuzzy logic","y":1965,"lane":"symbolic","s":"d","d":"Zadeh's graded truth. Ran 80s–90s consumer devices (cameras, rice cookers, trains), then drifted out of core AI research entirely.","deps":["logicprog"]},
{"id":"semweb","t":"Semantic Web (RDF/OWL)","y":2001,"lane":"symbolic","s":"d","d":"RDF and OWL standardized a machine-readable web of linked facts. The universal Semantic Web vision receded, but the standards persist in knowledge graphs and linked-data systems.","deps":["dlogic","internetdata"]},
{"id":"kgraphs","t":"Knowledge graphs at scale","y":2012,"lane":"symbolic","s":"r","d":"Google KG, Wikidata: semantic networks reborn industrially. Now the structured complement — and grounding source — for LLMs.","deps":["semanticnets","semweb"]},
{"id":"neurosymbolic","t":"Neuro-symbolic AI","y":2019,"lane":"symbolic","s":"a","d":"Marrying networks and symbols: program synthesis, tool use, logic-guided decoding. Perennial hope, real progress, no unified paradigm yet.","deps":["conndebate","kgraphs","transformer","neuralprog"]},
{"id":"gap_neurosym","t":"Symbolic rigor at LLM scale","y":2026,"lane":"symbolic","s":"g","d":"A system with LLM breadth whose every inference is formally checkable. Verified reasoning exists only in narrow math/code islands — nobody has fused the two regimes.","deps":["itp","frontier26","neurosymbolic"]}
);
/* ============ SEARCH, PLANNING & GAMES ============ */
P(
{"id":"shannonchess","t":"Shannon's chess blueprint","y":1950,"lane":"search","s":"f","d":"'Programming a Computer for Playing Chess': minimax plus evaluation functions. The founding document of game AI.","deps":["shannon48","turing36"]},
{"id":"minimaxab","t":"Alpha–beta & heuristic search","y":1958,"lane":"search","s":"f","d":"Pruning cut game trees exponentially; heuristic evaluation made search practical. The workhorse of classical AI.","deps":["shannonchess","lt56"]},
{"id":"astar","t":"A* search","y":1968,"lane":"search","s":"f","d":"Optimal pathfinding with admissible heuristics, built for Shakey. In every router, game engine and planner since.","deps":["minimaxab"]},
{"id":"strips","t":"STRIPS planning","y":1971,"lane":"search","s":"f","d":"Actions as precondition/effect schemas. The planning formalism — and the stage on which the frame problem performed.","deps":["gps","astar"]},
{"id":"csp","t":"Constraint satisfaction","y":1977,"lane":"search","s":"f","d":"Waltz line-labeling to Mackworth's arc consistency: propagate constraints instead of searching blindly. Scheduling and layout still run on it.","deps":["roberts63","strips"]},
{"id":"chinook","t":"Checkers conquered (Chinook)","y":1994,"lane":"search","s":"f","d":"First program to win a world title from humans; checkers fully solved by 2007. Proof of how far brute search + endgame tables go.","deps":["minimaxab","samuel"]},
{"id":"deepblue","t":"Deep Blue beats Kasparov","y":1997,"lane":"search","s":"f","d":"200M positions/sec plus hand-tuned evaluation topples chess. Taught two lessons: search scales, and chess wasn't intelligence after all.","deps":["minimaxab","moore"]},
{"id":"planningpddl","t":"Classical planning & PDDL","y":1998,"lane":"search","s":"d","d":"Mature solvers, annual competitions, logistics benchmarks — then a plateau outside them. Now probed again as scaffolding for LLM agents.","deps":["strips"]},
{"id":"satsolvers","t":"Modern SAT/SMT solvers","y":2001,"lane":"search","s":"a","d":"CDCL made logical search industrial: chip verification, software analysis. Symbolic AI's quietest, most deployed victory.","deps":["csp","resolution"]},
{"id":"mcts","t":"Monte Carlo Tree Search","y":2006,"lane":"search","s":"f","d":"Random rollouts + bandit selection cracked Go's branching factor. The bridge from classical search to AlphaGo — and to test-time reasoning.","deps":["minimaxab","bandits"]},
{"id":"poker","t":"Imperfect-info games solved","y":2017,"lane":"search","s":"f","d":"Libratus and Pluribus beat top pros via counterfactual regret minimization. Game theory made computational — then the labs moved on.","deps":["gametheory","mcts"]},
{"id":"llmsearch","t":"LLM-guided search","y":2023,"lane":"search","s":"h","d":"Tree-of-Thoughts, planner hybrids, verifier-guided decoding: classical search reborn with learned heuristics. The search lane merges into the LLM lane.","deps":["mcts","cot","planningpddl"]}
);
/* ============ REINFORCEMENT LEARNING & AGENTS ============ */
P(
{"id":"bandits","t":"Multi-armed bandits","y":1952,"lane":"rl","s":"f","d":"Robbins formalized explore-vs-exploit. From clinical trials to UCB — the mathematical kernel inside MCTS and every recommender.","deps":["stats25"]},
{"id":"mdp","t":"MDPs & Bellman equations","y":1957,"lane":"rl","s":"f","d":"Sequential decisions under uncertainty, solved by dynamic programming. Every RL algorithm is a way of solving Bellman's equation.","deps":["markov","gametheory"]},
{"id":"samuel","t":"Samuel's checkers learner","y":1959,"lane":"rl","s":"f","d":"Self-play plus a learned evaluation on 1950s hardware — machine learning's public debut and TD learning's ancestor.","deps":["shannonchess"]},
{"id":"tdlearning","t":"Temporal-difference learning","y":1988,"lane":"rl","s":"f","d":"Sutton: learn predictions from later predictions. RL's core algorithmic idea — later found running in dopamine neurons.","deps":["samuel","mdp"]},
{"id":"qlearning","t":"Q-learning","y":1989,"lane":"rl","s":"f","d":"Watkins' off-policy value learning with a convergence proof. Tabular RL matured — then waited 24 years for deep nets.","deps":["tdlearning"]},
{"id":"tdgammon","t":"TD-Gammon","y":1992,"lane":"rl","s":"f","d":"Neural net + TD self-play reached top-human backgammon. The AlphaGo recipe, 24 years early — then largely ignored for a decade.","deps":["tdlearning","backprop"]},
{"id":"policygrad","t":"Policy gradients (REINFORCE → actor–critic)","y":1992,"lane":"rl","s":"f","d":"REINFORCE optimized policies directly from sampled returns; actor–critic methods paired that policy with a learned value function. This is the missing bridge to PPO and RLHF.","deps":["mdp","sgd","tdlearning"]},
{"id":"dopamine","t":"Dopamine = TD error","y":1997,"lane":"rl","s":"f","d":"Schultz's recordings matched TD prediction error. Neuroscience validated RL's core signal — a rare two-way street between AI and brain.","deps":["tdlearning"]},
{"id":"rlbook","t":"RL synthesis (Sutton & Barto)","y":1998,"lane":"rl","s":"f","d":"REINFORCE, actor-critic, the textbook. Reinforcement learning becomes a coherent field with a shared language.","deps":["qlearning","tdlearning"]},
{"id":"hrl","t":"Hierarchical RL (options)","y":1999,"lane":"rl","s":"d","d":"Temporal abstraction: learn skills, compose them. Perennially promising, perpetually stuck — LLM planners now route around it from above.","deps":["rlbook"]},
{"id":"dqn","t":"DQN — Atari from pixels","y":2013,"lane":"rl","s":"f","d":"Deep nets + Q-learning + experience replay: one algorithm, 49 games, superhuman on many. Deep RL ignites (and DeepMind gets acquired).","deps":["qlearning","alexnet"]},
{"id":"alphago","t":"AlphaGo beats Lee Sedol","y":2016,"lane":"rl","s":"f","d":"Policy/value networks + MCTS + self-play. Move 37 became the era's cultural shockwave — a decade ahead of expert predictions.","deps":["mcts","dqn","tdgammon"]},
{"id":"alphazero","t":"AlphaZero / MuZero","y":2017,"lane":"rl","s":"f","d":"Tabula-rasa self-play mastering Go, chess, shogi; MuZero learns the rules too. Search and learning unified — the lane's high-water mark.","deps":["alphago"]},
{"id":"a3cppo","t":"Policy-gradient workhorses (PPO)","y":2017,"lane":"rl","s":"f","d":"TRPO→PPO made policy optimization stable and simple. The default deep-RL algorithm — later the engine inside RLHF.","deps":["rlbook","dqn","policygrad"]},
{"id":"curiosity","t":"Curiosity & intrinsic motivation","y":2017,"lane":"rl","s":"d","d":"Rewards from novelty and prediction error. Hot 2017–19, then faded — exploration at scale remains genuinely unsolved.","deps":["dqn","rlbook"]},
{"id":"marl","t":"Multi-agent RL","y":2017,"lane":"rl","s":"a","d":"Emergent cooperation, competition and tool use (hide-and-seek). Re-energized by LLM agent societies and mechanism-design questions.","deps":["gametheory","dqn"]},
{"id":"worldmodels18","t":"World Models (Ha & Schmidhuber)","y":2018,"lane":"rl","s":"f","d":"VAE+RNN agent trained inside its own learned dream. The seed of today's world-model wave — imagination as a training ground.","deps":["vae","lstm"]},
{"id":"modelbased","t":"Model-based RL (Dreamer)","y":2019,"lane":"rl","s":"a","d":"Learn the world, plan in imagination. The sample-efficiency path that matured into world-model agents for robots and games.","deps":["worldmodels18","rlbook"]},
{"id":"dota5","t":"OpenAI Five & AlphaStar","y":2019,"lane":"rl","s":"f","d":"Superhuman Dota 2 and StarCraft II via massive self-play. Peak-then-pivot: point proven, labs promptly abandoned esports for language.","deps":["alphago","a3cppo"]},
{"id":"openended","t":"Open-endedness (POET)","y":2019,"lane":"rl","s":"a","d":"Systems that endlessly generate their own challenges. Niche but philosophically central — the question behind 'never-ending' agents.","deps":["neat","curiosity","mapelites"]},
{"id":"offlinerl","t":"Offline RL & sequence policies","y":2020,"lane":"rl","s":"a","d":"Learn policies from logged trajectories without online exploration. Distribution shift remains hard, while Decision Transformer reframed policy learning as sequence modeling and the field feeds robotics and preference pipelines.","deps":["dqn","rlbook","transformer","continuousrl","imitation"]},
{"id":"gato","t":"Generalist agents (Gato)","y":2022,"lane":"rl","s":"d","d":"One transformer, 600 tasks, none mastered. Scaling alone didn't cure breadth-without-depth; quietly shelved as LLM agents took the crown.","deps":["transformer","dqn","offlinerl"]},
{"id":"agentsllm","t":"LLM agents & tool use","y":2023,"lane":"rl","s":"h","d":"ReAct→computer use→autonomous coding: language models that act. 2025–26's dominant paradigm — and its reliability problem.","deps":["chatgpt","cot","codegen","denseretrieval","groundedplanning"]},
{"id":"rlvr","t":"RL on verifiable rewards","y":2024,"lane":"rl","s":"h","d":"Train reasoning against checkable answers (math, code, proofs). The engine of o1/R1-class models — RL's biggest win since AlphaGo.","deps":["a3cppo","cot","rlhf"]},
{"id":"gap_openended","t":"Robust, general open-ended self-improvement","y":2026,"lane":"rl","s":"g","d":"Self-generated tasks and self-editing agents now show bounded improvement under human-designed verifiers. Still missing: safe, broadly general, sustained improvement without benchmark gaming, collapse, or a fixed external objective.","deps":["openended","agentsllm","alphaevolve","selfgenagents"]}
);
/* ============ NEURAL ARCHITECTURES ============ */
P(
{"id":"perceptron","t":"Perceptron (Rosenblatt)","y":1958,"lane":"neural","s":"f","d":"Hardware neuron that learned from examples; the Navy promised it would 'walk, talk, see, write.' The hype and the machine that started it all.","deps":["mcculloch43","hebb49"]},
{"id":"adaline","t":"ADALINE & delta rule","y":1960,"lane":"neural","s":"f","d":"Widrow–Hoff gradient learning in analog hardware. LMS still runs in every modem — neural nets' first quiet deployment.","deps":["perceptron"]},
{"id":"perceptronsbook","t":"'Perceptrons' kills the field","y":1969,"lane":"neural","s":"x","d":"Minsky & Papert proved single-layer limits (XOR); funding evaporated for 15 years. The canonical premature burial — multilayer nets weren't disproven, just undone.","deps":["perceptron"]},
{"id":"neocognitron","t":"Neocognitron","y":1980,"lane":"neural","s":"f","d":"Fukushima stacked Hubel–Wiesel receptive fields into a deep hierarchy. CNNs before backprop — an idea waiting 30 years for compute.","deps":["hubel59","perceptron"]},
{"id":"hopfield","t":"Hopfield networks","y":1982,"lane":"neural","s":"r","d":"Energy-based associative memory that re-legitimized neural research. Faded for decades — then 'modern Hopfield' math turned out to equal attention. 2024 Nobel.","deps":["hebb49"]},
{"id":"boltzmann","t":"Boltzmann machines","y":1985,"lane":"neural","s":"d","d":"Stochastic energy models with hidden units. Training pain sidelined them, but their DNA lives in RBMs, energy-based models and diffusion.","deps":["hopfield"]},
{"id":"rbm","t":"Restricted Boltzmann machines","y":1986,"lane":"neural","s":"f","d":"Smolensky's bipartite Harmonium made Boltzmann machines easier to train; contrastive divergence revived it in the mid-2000s. Stacking RBMs supplied the pretraining recipe for deep belief networks.","deps":["boltzmann"]},
{"id":"backprop","t":"Backpropagation","y":1986,"lane":"neural","s":"f","d":"Rumelhart–Hinton–Williams popularized credit assignment through layers (roots: Linnainmaa '70, Werbos '74). THE algorithm of the modern era.","deps":["adaline","perceptronsbook"]},
{"id":"pdp86","t":"PDP & connectionism revival","y":1986,"lane":"neural","s":"f","d":"The two-volume manifesto that brought neural nets back into cognitive science and AI. Winter number one, officially over.","deps":["backprop","boltzmann"]},
{"id":"universalapprox","t":"Universal approximation","y":1989,"lane":"neural","s":"f","d":"MLPs can represent any function — existence, not learnability. Comfort, and false comfort, for a generation of theorists.","deps":["backprop"]},
{"id":"cnn89","t":"LeNet CNNs","y":1989,"lane":"neural","s":"f","d":"LeCun fused neocognitron structure with backprop; read ~10% of US checks by the late 90s. Then waited 15 years for its GPU moment.","deps":["neocognitron","backprop"]},
{"id":"rnn","t":"Recurrent networks","y":1990,"lane":"neural","s":"f","d":"Elman nets and backprop-through-time: sequence processing with memory. NLP's neural substrate until 2017.","deps":["backprop"]},
{"id":"vanishing","t":"Vanishing-gradient diagnosis","y":1991,"lane":"neural","s":"f","d":"Hochreiter's analysis of why depth wouldn't train. The diagnosis behind LSTM, pretraining detours, and eventually residual connections.","deps":["rnn"]},
{"id":"lstm","t":"LSTM","y":1997,"lane":"neural","s":"f","d":"Gated memory defeats vanishing gradients. Carried speech and translation until 2017 — then dethroned by the transformer.","deps":["rnn","vanishing"]},
{"id":"dbn","t":"Deep belief nets & pretraining","y":2006,"lane":"neural","s":"x","d":"Layer-wise stacks of restricted Boltzmann machines re-ignited deep learning, then were superseded once ReLU networks and GPUs trained effectively end to end. A historically important transitional method.","deps":["rbm","vanishing"]},
{"id":"autoencoders","t":"Autoencoders","y":2006,"lane":"neural","s":"f","d":"Compression as self-supervision. Ancestor of VAEs, masked pretraining, and the representation-learning worldview.","deps":["backprop","dbn"]},
{"id":"attention","t":"Attention mechanism","y":2014,"lane":"neural","s":"f","d":"Bahdanau's soft alignment for translation: look where it matters. The seed the transformer grew from.","deps":["seq2seq"]},
{"id":"ntm","t":"Neural Turing Machines / DNC","y":2014,"lane":"neural","s":"x","d":"Differentiable external memory. Beautiful, barely trainable, abandoned — yet it foreshadowed tool use, RAG and memory-augmented agents.","deps":["lstm","turing36"]},
{"id":"resnet","t":"ResNet — residual connections","y":2015,"lane":"neural","s":"f","d":"Skip connections let 100+ layers train. In literally everything since, transformers included. Depth's final unlock.","deps":["alexnet","vanishing","batchnorm"]},
{"id":"hypernet","t":"Hypernetworks & fast weights","y":2016,"lane":"neural","s":"d","d":"Networks generating other networks' weights. Never mainstream, but conceptually adjacent to LoRA, in-context learning and test-time adaptation.","deps":["rnn"]},
{"id":"transformer","t":"Transformer","y":2017,"lane":"neural","s":"f","d":"'Attention Is All You Need': ditch recurrence, keep attention, parallelize everything. The architecture of the modern era — still unseated in 2026.","deps":["attention","layernorm"],"sup":["lstm"]},
{"id":"gnn","t":"Graph neural networks","y":2017,"lane":"neural","s":"a","d":"Message passing on graphs. The 2018–21 hype cooled; quietly indispensable in chemistry, chip design and weather.","deps":["cnn89","kgraphs"]},
{"id":"capsules","t":"Capsule networks","y":2017,"lane":"neural","s":"x","d":"Part–whole representations with learned routing offered an alternative to conventional CNNs. They did not become a mainstream replacement, but remain a specialist research line rather than a proven impossibility.","deps":["cnn89"]},
{"id":"neuralode","t":"Neural ODEs","y":2018,"lane":"neural","s":"a","d":"Neural networks parameterize continuous-time dynamics solved by differential-equation methods. Adoption is specialized but active in time series, control, scientific machine learning, and continuous normalizing flows.","deps":["resnet"]},
{"id":"moe","t":"Mixture-of-Experts","y":2017,"lane":"neural","s":"a","d":"Conditional compute: route each token through a sliver of a huge model. A 1991 idea that became the standard frontier architecture (Mixtral, DeepSeek-V3).","deps":["transformer"]},
{"id":"linattn","t":"Linear-attention wave","y":2020,"lane":"neural","s":"d","d":"Performer, RWKV, and related methods sought subquadratic alternatives to exact attention. Better kernels narrowed the case, but recurrent and linear-attention variants remain an active efficiency niche and influenced state-space models.","deps":["transformer"]},
{"id":"ssm","t":"State-space models (S4→Mamba)","y":2021,"lane":"neural","s":"a","d":"Linear-time sequence modeling from control theory. The strongest transformer alternative — surviving as hybrid attention+SSM layers rather than replacement.","deps":["kalman","rnn","transformer"]},
{"id":"titans","t":"Test-time memory (Titans)","y":2025,"lane":"neural","s":"h","d":"Architectures whose weights update while running — nested learning against frozen-model amnesia. The architectural frontier of 2025–26.","deps":["transformer","ssm","hypernet"]},
{"id":"gap_energyllm","t":"Energy-based LMs at scale","y":2026,"lane":"neural","s":"g","d":"JEPA/EBM-style non-autoregressive intelligence — LeCun's standing bet against next-token prediction. Nobody has trained one at frontier scale to settle it.","deps":["boltzmann","vjepa"]}
);
/* ============ TRAINING, SCALE & EFFICIENCY ============ */
P(
{"id":"sgd","t":"Stochastic gradient descent","y":1951,"lane":"training","s":"f","d":"Robbins–Monro stochastic approximation. The humble optimizer that, with tweaks, trained everything from ADALINE to GPT.","deps":["stats25"]},
{"id":"catforget","t":"Catastrophic forgetting identified","y":1989,"lane":"training","s":"f","d":"McCloskey & Cohen: networks overwrite old skills when learning new ones. The 35-year-old bug that still defines the continual-learning agenda.","deps":["pdp86"]},
{"id":"relu","t":"ReLU, dropout & practical depth","y":2011,"lane":"training","s":"f","d":"Two cheap tricks — sparse activations, random deletion — made deep nets trainable without pretraining scaffolds. Simplicity beat cleverness.","deps":["dbn","gpgpu"]},
{"id":"adam","t":"Adam → AdamW","y":2014,"lane":"training","s":"f","d":"Adaptive moments became the default optimizer; AdamW's decoupled weight decay became the durable modern variant. A thousand challengers later, the family remains stubbornly dominant.","deps":["sgd"]},
{"id":"batchnorm","t":"Batch normalization","y":2015,"lane":"training","s":"f","d":"Mini-batch statistics stabilized and accelerated deep-network training, becoming a standard ingredient in convolutional networks and the ResNet lineage.","deps":["relu"]},
{"id":"layernorm","t":"Layer normalization","y":2016,"lane":"training","s":"f","d":"Normalization across a layer's features removed dependence on batch statistics. It became the normalization backbone of recurrent networks and transformers.","deps":["batchnorm"]},
{"id":"distillation","t":"Knowledge distillation","y":2015,"lane":"training","s":"a","d":"Big teacher → small student. Now the pipeline by which frontier capability reaches phones and open models.","deps":["alexnet"]},
{"id":"transfer","t":"Transfer learning era","y":2018,"lane":"training","s":"f","d":"Pretrain once, fine-tune everywhere (ULMFiT→BERT). Ended from-scratch ML and created the model-hub economy.","deps":["alexnet","bert","maml"]},
{"id":"selfsup","t":"Self-supervised learning","y":2015,"lane":"training","s":"f","d":"Learning supervisory signals from the data itself: contrastive learning, masked prediction, and predictive pretraining. SimCLR, MAE, wav2vec and BERT made it a shared foundation across vision, speech and language.","deps":["autoencoders","word2vec"]},
{"id":"bitterlesson","t":"The Bitter Lesson","y":2019,"lane":"training","s":"f","d":"Sutton's essay: general methods riding compute beat human-crafted cleverness, every time so far. The scaling era's ideology — and its critics' target.","deps":["deepblue","alexnet"]},
{"id":"scalinglaws","t":"Scaling laws → Chinchilla","y":2020,"lane":"training","s":"f","d":"Loss falls as a power law in compute, data, parameters (Kaplan 2020); Chinchilla corrected the data ratio (2022). Research became engineering.","deps":["gpt2","transformer","mixedprecision"]},
{"id":"lora","t":"LoRA & parameter-efficient tuning","y":2021,"lane":"training","s":"f","d":"Low-rank adapters: customize a giant model on one GPU. Democratized fine-tuning and powered the open-weight explosion.","deps":["transfer","gpt3"]},
{"id":"quant","t":"Quantization & sparsity","y":2022,"lane":"training","s":"a","d":"INT8→FP4, pruning and structured sparsity shrink models for deployment while trading off memory, throughput and accuracy.","deps":["distillation","gpgpu"]},
{"id":"flash","t":"FlashAttention & kernel craft","y":2022,"lane":"training","s":"f","d":"IO-aware exact attention. Hardware-sympathetic algorithms beat clever approximations — and killed the linear-attention wave.","deps":["transformer","gpgpu","mixedprecision","mlcompiler"],"sup":["linattn"]},
{"id":"datacentric","t":"Data curation & synthetic data","y":2023,"lane":"training","s":"a","d":"Mixtures, dedup, quality filters — then models teaching models (phi, distilled reasoning traces). Data quality as the real moat.","deps":["scalinglaws","gpt4"]},
{"id":"testtime","t":"Test-time compute scaling","y":2024,"lane":"training","s":"h","d":"Think longer instead of training bigger — the o1 insight. A second scaling axis, with search and verification in the loop.","deps":["cot","scalinglaws","mcts"]},
{"id":"grpo","t":"Efficient RL recipes (GRPO, R1)","y":2025,"lane":"training","s":"h","d":"DeepSeek's cheap RL-for-reasoning stack: frontier capability at a fraction of assumed cost. Efficiency itself as geopolitical disruption.","deps":["rlvr","moe"]},
{"id":"continual","t":"Continual learning push","y":2025,"lane":"training","s":"h","d":"Nested learning, Titans-style memory, weight consolidation: the 2025–26 assault on catastrophic forgetting. Frontier labs now call it solvable.","deps":["catforget","titans","lora"]},
{"id":"dp","t":"Differential privacy in ML","y":2016,"lane":"training","s":"a","d":"Provable privacy budgets for training. Deployed in census and keyboards; a steady niche rather than a wave.","deps":["sgd"]},
{"id":"federated","t":"Federated learning","y":2017,"lane":"training","s":"a","d":"Training across devices or organizations without centralizing their raw data. It is deployed in privacy-sensitive settings and remains an active research area in optimization, security, and heterogeneous clients.","deps":["dp"]},
{"id":"dltheory","t":"Deep learning theory (NTK, double descent)","y":2019,"lane":"training","s":"a","d":"Why do overparameterized nets generalize? NTK, double descent, lottery tickets — insight-rich, prediction-poor. Theory still trails practice by years.","deps":["universalapprox","backprop"]},
{"id":"gap_memory","t":"Sleep & memory consolidation","y":2026,"lane":"training","s":"g","d":"Brains consolidate episodic experience into weights offline — 'sleep'. No frontier system has a principled equivalent; context windows are a workaround, not an answer.","deps":["continual","titans"]}
);
/* ============ LANGUAGE & FOUNDATION MODELS ============ */
P(
{"id":"mtgeorgetown","t":"Georgetown MT demo → ALPAC","y":1954,"lane":"language","s":"x","d":"Russian→English demo promised solved-in-5-years; the 1966 ALPAC report axed US funding. NLP's first boom-bust cycle, complete in twelve years.","deps":["shannon48"]},
{"id":"chomsky","t":"Generative grammar","y":1957,"lane":"language","s":"f","d":"Chomsky's formal syntax hierarchies fueled symbolic NLP for decades — and his 'poverty of stimulus' argued pure learning could never acquire language. LLMs reopened the case.","deps":["cogrev"]},
{"id":"eliza","t":"ELIZA","y":1966,"lane":"language","s":"f","d":"Weizenbaum's pattern-matching 'therapist'. The first chatbot — and the first Eliza effect, as users projected understanding onto scripts.","deps":["turingtest"]},
{"id":"conceptualdep","t":"Scripts & conceptual dependency","y":1972,"lane":"language","s":"d","d":"Schank: meaning as canonical structures, stories as scripts. Rich theory with a hand-built ceiling; faded with the statistical turn.","deps":["semanticnets","chomsky"]},
{"id":"hmmspeech","t":"HMM speech recognition","y":1975,"lane":"language","s":"x","d":"Jelinek's statistical turn ('every time I fire a linguist, performance goes up'). Ruled speech for 35 years — then deep nets retired it.","deps":["markov","stats25"]},
{"id":"ngram","t":"n-gram language models","y":1980,"lane":"language","s":"x","d":"Count word sequences, predict the next. Powered search and speech for decades — the ancestor LLMs obliterated and descend from.","deps":["shannon48","hmmspeech"]},
{"id":"ir","t":"Vector-space information retrieval","y":1975,"lane":"language","s":"f","d":"Documents and queries represented as weighted term vectors made ranked search practical. This classical retrieval lineage runs through Watson and into retrieval-augmented generation.","deps":["shannon48","stats25"]},
{"id":"treebank","t":"Penn Treebank & statistical NLP","y":1993,"lane":"language","s":"f","d":"Annotated corpora turned linguistics into a measurable, competitive sport. The empirical culture LLMs inherited.","deps":["chomsky","ngram"]},
{"id":"smt","t":"Statistical machine translation","y":1993,"lane":"language","s":"x","d":"IBM's noisy-channel models revived MT from the ALPAC ashes; phrase-based SMT ran Google Translate for a decade — then neural MT ended it overnight.","deps":["ngram","mtgeorgetown"]},
{"id":"wordnet","t":"WordNet & lexical resources","y":1995,"lane":"language","s":"d","d":"Hand-built graphs of word meaning. Foundational for an era of NLP; essentially frozen since embeddings learned the same structure from text.","deps":["semanticnets"]},
{"id":"bengio03","t":"Neural language model","y":2003,"lane":"language","s":"f","d":"Bengio's neural LM: word embeddings + shared statistical strength. The right idea, one GPU generation too early.","deps":["ngram","backprop"]},
{"id":"watson","t":"IBM Watson","y":2011,"lane":"language","s":"x","d":"Jeopardy! triumph via hybrid NLP+IR — then a healthcare moonshot that burned billions and was sold for parts. The era's overclaim case study.","deps":["treebank","ngram","ir"]},
{"id":"dlspeech","t":"Deep speech recognition","y":2012,"lane":"language","s":"f","d":"DNNs halved error rates and retired the HMM pipeline — deep learning's first industrial conquest, before vision's.","deps":["dbn"],"sup":["hmmspeech"]},
{"id":"word2vec","t":"word2vec / GloVe","y":2013,"lane":"language","s":"x","d":"Meaning as geometry ('king − man + woman ≈ queen'). Static embeddings were superseded by contextual ones — but the vector worldview conquered everything.","deps":["bengio03"]},
{"id":"seq2seq","t":"seq2seq encoder–decoder","y":2014,"lane":"language","s":"f","d":"Sentence in, sentence out, via LSTMs. Machine translation went neural — and 'everything is sequence transduction' became a research program.","deps":["lstm","bengio03"]},
{"id":"nmt","t":"Neural MT deployed (GNMT)","y":2016,"lane":"language","s":"f","d":"Google Translate's overnight quality jump — the first mass-scale deep NLP product, and SMT's abrupt retirement.","deps":["seq2seq","attention","subword"],"sup":["smt"]},
{"id":"bert","t":"BERT & pretrain–finetune","y":2018,"lane":"language","s":"f","d":"Masked bidirectional pretraining smashed 11 benchmarks at once. Made 'foundation model' thinkable; encoder line since retired to embeddings duty.","deps":["transformer","selfsup","elmo","subword"],"sup":["word2vec"]},
{"id":"gpt2","t":"GPT-2 — generation scales","y":2019,"lane":"language","s":"f","d":"Decoder-only LM 'too dangerous to release' — showed unsupervised generation plus zero-shot glimmers. The scaling bet forms.","deps":["transformer","bengio03","subword"],"sup":["ngram"]},
{"id":"gpt3","t":"GPT-3 & in-context learning","y":2020,"lane":"language","s":"f","d":"175B parameters; few-shot prompting emerged unbidden — a capability nobody trained for. NLP's API era begins.","deps":["gpt2","scalinglaws"]},
{"id":"codegen","t":"Code generation (Codex→Copilot)","y":2021,"lane":"language","s":"h","d":"From autocomplete to agentic software engineering. The capability that let AI build AI tooling — and reshaped programming itself.","deps":["gpt3","neuralprog"]},
{"id":"cot","t":"Chain-of-thought prompting","y":2022,"lane":"language","s":"f","d":"'Think step by step' unlocked latent multi-step reasoning. The prompt era's deepest finding — later trained-in via RL.","deps":["gpt3"]},
{"id":"instruct","t":"InstructGPT — RLHF assistants","y":2022,"lane":"language","s":"f","d":"Supervised demonstrations, reward modeling and PPO turned pretrained LMs into preference-tuned assistants. This RLHF deployment recipe is distinct from the earlier supervised instruction-tuning lineage.","deps":["gpt3","rlhf","instructiontune"]},
{"id":"chatgpt","t":"ChatGPT moment","y":2022,"lane":"language","s":"f","d":"100M users in two months. A research artifact became planetary infrastructure overnight — and reset funding, talent and politics for the whole field.","deps":["instruct","nucleus","instructiontune"]},
{"id":"promptengineering","t":"Standalone prompt-engineer fad","y":2023,"lane":"language","s":"x","d":"The short-lived job-title and incantation culture around prompt-only optimization faded. Prompt design itself remains active and was absorbed into broader context engineering, evaluation, retrieval, and product design.","deps":["cot","chatgpt"]},
{"id":"contexteng","t":"Context engineering","y":2025,"lane":"language","s":"h","d":"Designing the full information environment around a model: instructions, retrieved evidence, tools, memory, and state. The operational successor to prompt-only optimization for production agents.","deps":["promptengineering","rag","longctx","mcp","denseretrieval"]},
{"id":"gpt4","t":"GPT-4-class multimodal LLMs","y":2023,"lane":"language","s":"f","d":"Bar exams passed, images understood. The capability jump that reset expectations, safety debates and national policy at once.","deps":["chatgpt","scalinglaws"]},
{"id":"openweights","t":"Open-weight ecosystem","y":2023,"lane":"language","s":"h","d":"Llama leak → Llama 2/3 → Mistral, Qwen, DeepSeek. Weights in the wild: fine-tune culture, sovereignty politics, and a live frontier-gap debate.","deps":["chatgpt","lora","hf","nucleus","instructiontune"]},
{"id":"rag","t":"Retrieval-augmented generation","y":2020,"lane":"language","s":"a","d":"Bolt a search engine to the model. The hallucination patch that became commodity plumbing — now competing with million-token contexts.","deps":["bert","ir","kgraphs","denseretrieval"]},
{"id":"longctx","t":"Long context (100K→1M+)","y":2023,"lane":"language","s":"a","d":"RoPE scaling, efficient attention, context engineering. Whole books in the prompt — rivaling retrieval for many workloads.","deps":["flash","gpt4","llmserving"]},
{"id":"reasoning","t":"Reasoning models (o1→o3, R1)","y":2024,"lane":"language","s":"h","d":"RL-trained deliberate thinking with visible chains of thought. Olympiad-level math and code jumps — the current capability frontier.","deps":["cot","rlvr","testtime"]},
{"id":"diffusionllm","t":"Diffusion language models","y":2025,"lane":"language","s":"a","d":"Mercury, Gemini Diffusion: parallel denoising instead of left-to-right generation. A speed-play challenger to autoregression — early days.","deps":["diffusion","gpt4"]},
{"id":"frontier26","t":"Frontier assistants (GPT-5, Gemini 3, Claude)","y":2025,"lane":"language","s":"h","d":"Converged reasoning + multimodal + agents, competing on reliability, cost and depth-of-thought. The 2026 state of the art.","deps":["gpt4","reasoning","agentsllm","speechfm","instructiontune","llmserving","agentbench"]},
{"id":"elmo","t":"ELMo contextual embeddings","y":2018,"lane":"language","s":"f","d":"Deep bidirectional language models produced word representations that changed with context. ELMo made the transition from static embeddings to BERT-style contextual pretraining explicit.","deps":["lstm","word2vec","selfsup"]}
);
/* ============ COMPUTER VISION ============ */
P(
{"id":"roberts63","t":"Blocks-world vision","y":1963,"lane":"vision","s":"f","d":"Roberts' edges and 3D from line drawings — computer vision's first thesis. Minsky assigned vision as a summer project in 1966; it took 50 years.","deps":["hubel59"]},
{"id":"marr","t":"Marr's computational vision","y":1979,"lane":"vision","s":"f","d":"Levels of analysis, primal sketch → 2.5D → 3D. Shaped a generation of vision science; aged into the anti-example for end-to-end learning.","deps":["roberts63","hubel59"]},
{"id":"sift","t":"Hand-crafted features (SIFT, HOG)","y":1999,"lane":"vision","s":"x","d":"Engineered descriptors ruled recognition for a decade of careful pipelines — rendered obsolete in one conference cycle after AlexNet.","deps":["marr"]},
{"id":"facedetect","t":"Viola–Jones face detection","y":2001,"lane":"vision","s":"f","d":"Real-time faces via boosted cascades — classical vision's biggest consumer deployment (every camera's focus box).","deps":["adaboost","sift"]},
{"id":"imagenet","t":"ImageNet & benchmark culture","y":2009,"lane":"vision","s":"f","d":"14M crowd-labeled images and an annual contest. The dataset that made deep learning measurable — and made benchmarks the field's engine.","deps":["internetdata","mturk"]},
{"id":"alexnet","t":"AlexNet — the big bang","y":2012,"lane":"vision","s":"f","d":"GPU-trained CNN dropped ImageNet error from 26% to 16%. The result that flipped the entire field to deep learning within 18 months.","deps":["cnn89","imagenet","gpgpu","relu"],"sup":["sift","dbn","svm"]},
{"id":"detection","t":"Detection & segmentation","y":2015,"lane":"vision","s":"f","d":"R-CNN→Mask R-CNN→DETR: from labels to boxes to pixels. The perception stack under AVs, robots and medical imaging.","deps":["alexnet","resnet"]},
{"id":"deepface","t":"Face recognition surpasses humans","y":2014,"lane":"vision","s":"f","d":"DeepFace/FaceNet crossed human accuracy — and dragged AI into surveillance politics, bias audits and bans. Capability and controversy, together.","deps":["alexnet"]},
{"id":"unet","t":"U-Net","y":2015,"lane":"vision","s":"f","d":"An encoder–decoder with skip connections built for biomedical segmentation. Its multiscale denoising shape later became the workhorse backbone of diffusion models.","deps":["cnn89","alexnet"]},
{"id":"vit","t":"Vision Transformer","y":2020,"lane":"vision","s":"f","d":"Images as patch tokens. Ended the CNN's 30-year reign and unified vision with language under one architecture.","deps":["transformer","imagenet"]},

{"id":"sam","t":"Promptable segmentation (SAM)","y":2023,"lane":"vision","s":"a","d":"Segment anything, zero-shot, from a click or a phrase. Foundation-model economics arrive in core vision tooling.","deps":["vit","clip"]},
{"id":"neural3d","t":"Neural 3D (NeRF→Gaussian splatting)","y":2020,"lane":"vision","s":"a","d":"Scenes as learned radiance fields; photoreal 3D from phone photos. Feeding robotics sims, film, and world models.","deps":["resnet","marr"]},

{"id":"multimodal","t":"Native multimodal models","y":2023,"lane":"vision","s":"f","d":"GPT-4V→Gemini: see, hear, speak in one model. Vision stopped being a separate field and became an input mode.","deps":["clip","gpt4","speechfm"]}
