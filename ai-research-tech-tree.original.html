/* ============ GENERATIVE MODELS ============ */
P(
{"id":"vae","t":"Variational autoencoders","y":2013,"lane":"generative","s":"f","d":"Probabilistic latent spaces you can sample. Generative deep learning's respectable start — and diffusion's mathematical grandparent.","deps":["autoencoders","mcmc"]},
{"id":"gan","t":"GANs","y":2014,"lane":"generative","s":"d","d":"Forger vs detective training. Ruled generation 2014–20 (StyleGAN faces, deepfakes) — dethroned by diffusion; lingers in fast-sampling and super-res niches.","deps":["gametheory","vae","optimaltransport"]},
{"id":"flows","t":"Normalizing flows","y":2015,"lane":"generative","s":"a","d":"Invertible networks provide exact likelihoods and efficient sampling. Diffusion dominates general image generation, but flows remain active in density estimation, simulation-based inference, and scientific applications.","deps":["vae","optimaltransport"]},
{"id":"neuralstyle","t":"DeepDream & style transfer","y":2015,"lane":"generative","s":"x","d":"Gram-matrix artistry and dog-faced clouds — the first viral neural art. Charming, superseded by text-to-image control.","deps":["alexnet"]},
{"id":"wavenet","t":"WaveNet & neural audio","y":2016,"lane":"generative","s":"f","d":"Autoregressive raw waveforms made TTS human-grade. Ancestor of every voice clone and music model since.","deps":["cnn89","rnn"]},
{"id":"diffusion","t":"Diffusion models","y":2020,"lane":"generative","s":"f","d":"Denoise noise into data, step by step. Stable training beat GAN fragility — the generative workhorse across image, audio, video, molecules.","deps":["vae","boltzmann","unet"],"sup":["gan"]},
{"id":"txt2img","t":"Text-to-image (latent + guided diffusion)","y":2022,"lane":"generative","s":"f","d":"Latent diffusion made high-resolution synthesis economical; classifier-free guidance made text control practical. DALL·E 2 and Stable Diffusion brought language-steered imagery to everyone — and opened a copyright battlefield.","deps":["diffusion","clip","vqcodes"],"sup":["neuralstyle"]},
{"id":"dit","t":"Diffusion Transformers (DiT)","y":2023,"lane":"generative","s":"f","d":"Transformer backbones for diffusion — one scaling recipe across all media. The architecture under Sora-class video.","deps":["diffusion","vit","flowmatching"]},
{"id":"musicgen","t":"Music & voice generation","y":2023,"lane":"generative","s":"a","d":"Suno, ElevenLabs, voice cloning at consumer scale. Creative industries' negotiation with AI, conducted in real time.","deps":["wavenet","diffusion","vqcodes","speechfm"]},
{"id":"video","t":"Video generation (Sora→Veo 3)","y":2024,"lane":"generative","s":"h","d":"Minutes of coherent video with sound. The live question: are these world simulators in disguise, or very good pixel dreamers?","deps":["dit","txt2img","vqcodes","flowmatching"]},
{"id":"genie","t":"Interactive world models (Genie 3)","y":2024,"lane":"generative","s":"h","d":"Playable, promptable generated worlds. Games and training grounds for agents — a possible road to spatial intelligence (World Labs' Marble, too).","deps":["video","worldmodels18","vqcodes"]},
{"id":"gap_dreamtrain","t":"Robots trained in dreamed worlds","y":2026,"lane":"generative","s":"g","d":"Policies learned wholly inside generated video worlds that transfer to physical bodies. Genie-class models and robot FMs exist — the closed loop between them doesn't.","deps":["genie","rtfm","simenv","visuomotor"]}
);
/* ============ PROBABILISTIC & CAUSAL AI ============ */
P(
{"id":"stats25","t":"Statistical inference (Fisher; Bayes)","y":1925,"lane":"prob","s":"f","d":"Maximum likelihood, hypothesis testing, the Bayes–Laplace tradition. The bedrock mathematics machine learning repeatedly rediscovers.","deps":[]},
{"id":"kalman","t":"Kalman filter","y":1960,"lane":"prob","s":"f","d":"Optimal state estimation under noise — Apollo's navigator, every robot's pose tracker, and the ancestor of state-space models.","deps":["wiener48","markov"]},
{"id":"patternrec","t":"Statistical pattern recognition","y":1973,"lane":"prob","s":"f","d":"Duda & Hart: classification as statistics. Machine learning before the name existed.","deps":["stats25","perceptron"]},
{"id":"em","t":"EM algorithm","y":1977,"lane":"prob","s":"f","d":"Fit models with hidden variables by alternating expectation and maximization. The engine under HMMs, mixtures and topic models.","deps":["stats25"]},
{"id":"pac","t":"PAC learning & COLT","y":1984,"lane":"prob","s":"f","d":"Valiant: what is learnable, from how many examples? Learning theory born — rigor that both guided and lagged practice.","deps":["complexity71","patternrec"]},
{"id":"dtrees","t":"Decision trees (ID3/CART)","y":1986,"lane":"prob","s":"f","d":"Interpretable recursive splits. Still royalty on tabular data through their ensemble descendants.","deps":["patternrec"]},
{"id":"bayesnets","t":"Bayesian networks (Pearl)","y":1988,"lane":"prob","s":"f","d":"Modular probabilistic reasoning; rescued uncertainty from logic's grip, won Pearl a Turing Award, and seeded the causal turn.","deps":["em","stats25"]},
{"id":"mcmc","t":"MCMC & variational inference","y":1990,"lane":"prob","s":"f","d":"Sample or bound intractable posteriors. The machinery under Bayesian ML — and, via the ELBO, under VAEs and diffusion.","deps":["stats25","em"]},
{"id":"svm","t":"SVMs & kernel methods","y":1995,"lane":"prob","s":"d","d":"Max-margin plus the kernel trick: ML's monarch 1995–2010, with actual theory. Dethroned by deep nets; retired to small-data niches.","deps":["pac","patternrec"]},
{"id":"gp","t":"Gaussian processes","y":1996,"lane":"prob","s":"d","d":"Priors over functions with honest uncertainty. Elegant, O(n³)-cursed — survives inside Bayesian optimization.","deps":["stats25","bayesnets"]},
{"id":"adaboost","t":"Boosting & random forests","y":1996,"lane":"prob","s":"a","d":"Committees of weak learners (AdaBoost→XGBoost). Thirty years on, still the champion of messy tabular business data.","deps":["dtrees","pac"]},
{"id":"graphicalmodels","t":"Structured prediction (CRFs)","y":2001,"lane":"prob","s":"d","d":"Conditional random fields were central to structured prediction in 2000s NLP and vision. Neural models displaced them from the frontier, but CRFs remain useful where structured labels and explicit dependencies matter.","deps":["bayesnets","em"]},
{"id":"topicmodels","t":"Topic models (LDA)","y":2003,"lane":"prob","s":"d","d":"Latent Dirichlet allocation modeled corpora as mixtures of themes. Embeddings and LLMs displaced it from the frontier, while interpretable corpus exploration and digital-humanities uses persist.","deps":["mcmc","em"]},
{"id":"recsys","t":"Recommender systems","y":2007,"lane":"prob","s":"a","d":"Netflix Prize matrix factorization → trillion-parameter ad models. The profitable dark matter of ML — huge, deployed, rarely glamorous.","deps":["em","sgd"]},
{"id":"causal","t":"Causal inference","y":2000,"lane":"prob","s":"a","d":"do-calculus and counterfactuals: reasoning about interventions, not correlations. Deep learning's acknowledged blind spot; integration keeps being attempted.","deps":["bayesnets"]},
{"id":"bayesopt","t":"Bayesian optimization, NAS & AutoML","y":2012,"lane":"prob","s":"a","d":"Bayesian optimization tunes expensive black boxes sample-efficiently; neural architecture search and population-based training broadened AutoML into architecture and schedule search. Useful everywhere, fully automatic science nowhere.","deps":["gp","ga","policygrad"]},
{"id":"probprog","t":"Probabilistic programming","y":2012,"lane":"prob","s":"a","d":"Models expressed as programs with automated inference, including Stan and language-based systems descended from Church. A specialist but active ecosystem used in science, statistics, and uncertainty-aware modeling.","deps":["mcmc","lisp"]},
{"id":"conformal","t":"Calibration, ensembles & conformal UQ","y":2016,"lane":"prob","s":"a","d":"Deep ensembles and calibration estimate uncertainty empirically; conformal methods add distribution-free coverage guarantees under stated assumptions. A broader reliability toolkit than any one method — still underused in LLM deployment.","deps":["gp","stats25","alexnet","oodshift"]},
{"id":"gap_causal","t":"Causal world models","y":2026,"lane":"prob","s":"g","d":"Marry do-calculus with learned world models: agents that reason about interventions and counterfactuals, not correlations. Two mature fields, no real fusion.","deps":["causal","genie","modelbased"]},
{"id":"gap_tabular","t":"Deep learning vs tabular data","y":2026,"lane":"prob","s":"g","d":"Gradient-boosted trees still beat neural nets on messy business tables — 30 years of deep progress hasn't cracked why, or fixed it. A famous, unglamorous open front.","deps":["adaboost","transformer"]}
);
/* ============ ALTERNATIVE COMPUTING & LEARNING ============ */
P(
{"id":"cellauto","t":"Self-reproducing automata","y":1951,"lane":"alt","s":"f","d":"Von Neumann's cellular automata: machines that copy themselves. The origin of artificial life and complexity science.","deps":["vonneumann45"]},
{"id":"evolstrat","t":"Evolution strategies","y":1965,"lane":"alt","s":"f","d":"Rechenberg & Schwefel: mutate, select, repeat — optimization borrowed from biology, born in wind-tunnel engineering.","deps":[]},
{"id":"ga","t":"Genetic algorithms","y":1975,"lane":"alt","s":"f","d":"Holland's crossover + fitness + schema theorem. The adaptationist program in computing; parent of a whole evolutionary lane.","deps":["evolstrat","cellauto"]},
{"id":"alife","t":"Artificial life","y":1987,"lane":"alt","s":"d","d":"Tierra, Avida: digital ecologies of self-replicators. The open-ended-evolution question remains open — the lane's unfinished business.","deps":["cellauto","ga"]},
{"id":"gp92","t":"Genetic programming","y":1992,"lane":"alt","s":"d","d":"Koza: evolve the programs themselves. Produced patentable circuits, then was eclipsed by gradient methods — reborn as LLM-guided evolution.","deps":["ga"]},
{"id":"swarm","t":"Swarm intelligence (ACO, PSO)","y":1995,"lane":"alt","s":"d","d":"Ant trails and flocking as optimization. A conference-industrial complex with modest deployment — and an untouched link to modern robotics.","deps":["alife"]},
{"id":"neat","t":"Neuroevolution (NEAT)","y":2002,"lane":"alt","s":"d","d":"Evolving network topologies. Charming results, outscaled by gradient descent — brief ES-for-RL revival in 2017, then quiet again.","deps":["ga"]},
{"id":"spiking","t":"Spiking neural networks","y":1997,"lane":"alt","s":"d","d":"Event-driven, biologically-timed neurons — the 'third generation' that never found its killer app. Persistent hope of the neuromorphic program.","deps":["hebb49","hodgkin52"]},
{"id":"mead","t":"Analog VLSI neural hardware","y":1989,"lane":"alt","s":"f","d":"Carver Mead's silicon retinas and cochleas. Neuromorphic engineering's founding — physics as computation.","deps":["hubel59","shannon37"]},
{"id":"reservoir","t":"Reservoir computing","y":2001,"lane":"alt","s":"d","d":"Fixed random recurrence + trained readout. A clever shortcut that found its ceiling — revived interest wherever physical substrates compute.","deps":["rnn"]},
{"id":"htm","t":"Hierarchical Temporal Memory","y":2004,"lane":"alt","s":"x","d":"Hawkins' cortical theory as product (Numenta). Two decades of conviction, minimal ML impact — a parallel track that never merged with the mainline.","deps":["hubel59"]},
{"id":"dna","t":"DNA computing","y":1994,"lane":"alt","s":"d","d":"Adleman demonstrated combinatorial computation in DNA. General-purpose molecular computing remains niche, while adjacent DNA data-storage and biosensing research continues.","deps":["complexity71"]},
{"id":"neuromorphic","t":"Neuromorphic chips (Loihi)","y":2014,"lane":"alt","s":"d","d":"TrueNorth, Loihi, SpiNNaker: silicon spikes at microwatts. Research platforms in search of a market for a decade and counting.","deps":["spiking","mead"]},
{"id":"quantumml","t":"Quantum machine learning","y":2014,"lane":"alt","s":"d","d":"HHL and variational circuits promised speedups; barren plateaus and dequantization deflated them. No practical ML advantage demonstrated yet.","deps":["complexity71"]},
{"id":"optical","t":"Optical neural networks","y":2017,"lane":"alt","s":"a","d":"Optical systems perform neural-network operations using light. Photonic interconnects are nearer-term, while optical compute remains an active research program with continuing 2020s demonstrations.","deps":["mead"]},
{"id":"analogai","t":"Analog in-memory computing","y":2020,"lane":"alt","s":"a","d":"Compute inside memory cells to escape the von Neumann bottleneck. Real inference chips exist; training precision remains the wall.","deps":["mead","neuromorphic"]},
{"id":"alphaevolve","t":"LLM-guided evolution (AlphaEvolve)","y":2025,"lane":"alt","s":"h","d":"Evolutionary search with LLM mutation operators: new matrix-multiplication records, kernel speedups, open math results. Genetic programming's revenge.","deps":["gp92","gpt4","mapelites"]},
{"id":"gap_biolearn","t":"Learning without backprop","y":2026,"lane":"alt","s":"g","d":"Local, biologically-plausible rules (forward-forward, predictive coding) competitive at scale. Would unlock analog and neuromorphic hardware — nobody's close.","deps":["hebb49","spiking","analogai"]},
{"id":"gap_quant","t":"Quantum advantage for learning","y":2026,"lane":"alt","s":"g","d":"No ML task where quantum provably wins. Either find one or close the program — a decade of hedge-money says neither, yet.","deps":["quantumml"]}
);
/* ============ ROBOTICS & EMBODIED AI ============ */
P(

/* ============ SAFETY, ALIGNMENT & INTERPRETABILITY ============ */
P(
{"id":"asimov","t":"Asimov's Three Laws","y":1942,"lane":"safety","s":"f","d":"Fiction framed machine ethics decades before engineering could. Set the cultural frame every real safety debate still argues with.","deps":[]},
{"id":"wienerwarn","t":"Wiener's control warning","y":1960,"lane":"safety","s":"f","d":"'If we use, to achieve our purposes, a mechanical agency with whose operation we cannot interfere…' — value misalignment stated plainly, in 1960.","deps":["wiener48"]},
{"id":"weizenbaum","t":"'Computer Power and Human Reason'","y":1976,"lane":"safety","s":"f","d":"ELIZA's own creator warned against delegating judgment to machines. AI criticism as a serious intellectual tradition begins here.","deps":["eliza"]},
{"id":"aixi","t":"AIXI — universal intelligence","y":2000,"lane":"safety","s":"d","d":"Hutter: Solomonoff induction + RL as the optimal agent. Incomputable idealization — a framing device that shaped early alignment theory.","deps":["solomonoff","rlbook"]},

{"id":"superintbook","t":"'Superintelligence' (Bostrom)","y":2014,"lane":"safety","s":"f","d":"Orthogonality, instrumental convergence, the treacherous turn. Made existential risk respectable in policy and tech circles.","deps":["friendlyai"]},
{"id":"concreteproblems","t":"Concrete Problems in AI Safety","y":2016,"lane":"safety","s":"f","d":"Amodei et al. translated alignment into ML problems: reward hacking, safe exploration, scalable oversight. The field's practical founding paper.","deps":["superintbook","dqn"]},
{"id":"rlhf","t":"RLHF — learning from preferences","y":2017,"lane":"safety","s":"f","d":"Christiano et al.: train reward models from human comparisons. The technique made LLM assistants usable at scale, while reward-model overoptimization exposed a persistent specification failure rather than a solved alignment recipe.","deps":["concreteproblems","a3cppo"]},
{"id":"fairness","t":"Fairness & bias (FAccT)","y":2016,"lane":"safety","s":"a","d":"Measuring and mitigating disparate harms — COMPAS, face-recognition audits, dataset documentation. Ethics as an ML subfield, and a political flashpoint.","deps":["imagenet","deepface"]},
{"id":"advexamples","t":"Adversarial examples","y":2014,"lane":"safety","s":"a","d":"Imperceptible perturbations that fool networks. A decade of attack–defense arms race — unsolved, now mostly managed rather than fixed.","deps":["alexnet"]},
{"id":"interp","t":"Early interpretability (saliency→circuits)","y":2017,"lane":"safety","s":"a","d":"Feature visualization, attribution maps, Olah's circuits program. From pretty pictures toward an actual science of what networks compute.","deps":["alexnet"]},
{"id":"debate","t":"Debate & amplification (IDA)","y":2018,"lane":"safety","s":"d","d":"Alignment via argumentative games and recursive oversight. Theory-rich, deployment-poor — folded into today's scalable-oversight research.","deps":["concreteproblems"]},
{"id":"mechinterp","t":"Mechanistic interpretability","y":2022,"lane":"safety","s":"h","d":"Induction heads, superposition, sparse autoencoders finding millions of features. Reverse-engineering models — with a live debate over whether SAE features are real.","deps":["interp","transformer"]},

{"id":"dpo","t":"DPO & cheap preference tuning","y":2023,"lane":"safety","s":"a","d":"Preference alignment without an RL loop. Made alignment tooling commodity — for better (open models) and worse (easy de-alignment).","deps":["rlhf"]},
{"id":"jailbreaks","t":"Jailbreaks & prompt injection","y":2023,"lane":"safety","s":"a","d":"The attack surface of instruction-followers. Prompt injection remains the unsolved core vulnerability of agentic AI — the more tools, the more surface.","deps":["chatgpt","advexamples"]},
{"id":"superalign","t":"Superalignment (dissolved)","y":2023,"lane":"safety","s":"x","d":"OpenAI's 20%-of-compute pledge to align superintelligence — team dissolved within a year amid departures. A very public dropped thread; weak-to-strong work survived it.","deps":["rlhf","superintbook"]},
{"id":"w2s","t":"Scalable oversight & weak-to-strong","y":2023,"lane":"safety","s":"a","d":"Can weaker judges reliably train stronger models? The successor question once human feedback saturates — alignment's next hard problem.","deps":["debate","superalign","goalmisgen","modelediting"]},
{"id":"evals","t":"Evals & red-teaming discipline","y":2023,"lane":"safety","s":"h","d":"METR, AISIs, dangerous-capability evals, model cards. Measuring what models can do became its own research field — and the science is young.","deps":["gpt4","concreteproblems","modelleak","oodshift","backdoors","goalmisgen"]},
{"id":"govern","t":"Governance era (EU AI Act, AISIs)","y":2023,"lane":"safety","s":"a","d":"Law arrives: compute thresholds, transparency duties, incident reporting, safety institutes. Research and regulation now co-evolve.","deps":["evals","chatgpt","modelleak","backdoors","unlearning"]},
{"id":"provablysafe","t":"Guaranteed-safe AI","y":2023,"lane":"safety","s":"d","d":"Formal world-models and proof-carrying AI (Tegmark–Russell program). Aspiration far ahead of tooling — a program waiting for its methods.","deps":["itp","superintbook","neuralverify"]},
{"id":"gap_interp","t":"Reliable interpretability-based control","y":2026,"lane":"safety","s":"g","d":"Model editing and activation steering can change local facts and behaviors. Still missing: scalable, predictable interventions grounded in causal understanding, with robust generalization and meaningful guarantees.","deps":["mechinterp","w2s","modelediting"]},

);

{"id":"mcp","t":"Agent infrastructure (MCP)","y":2024,"lane":"systems","s":"h","d":"Standardized model-tool-data plumbing and orchestration. The 'HTTP moment' for agents, possibly — the plumbing decides what agents can safely do.","deps":["agentsllm"]},
{"id":"inferecon","t":"Inference economics","y":2024,"lane":"systems","s":"h","d":"Serving, caching, routing, token pricing: the cost curve that decides what actually deploys. Where systems research meets business model.","deps":["quant","flash","llmserving","mlcompiler"]},
{"id":"energy","t":"Energy & datacenter buildout","y":2024,"lane":"systems","s":"a","d":"Gigawatt campuses, nuclear PPAs, grid politics. AI's growth curve collided with physical infrastructure — the binding constraint after chips.","deps":["computegap"]},
{"id":"alphachip","t":"AI designs chips (AlphaChip)","y":2021,"lane":"systems","s":"a","d":"RL placement shipping in production TPUs. The ouroboros: AI improving the hardware that trains AI.","deps":["tpu","dqn"]},
{"id":"gap_data","t":"Post-data-wall learning","y":2026,"lane":"systems","s":"g","d":"What happens when high-quality human text runs out: synthetic-data loops without model collapse, experience-driven learning. The wall is visible; the ladder isn't.","deps":["datawalls","datacentric"]}
);
/* ============ AI FOR SCIENCE & APPLICATIONS ============ */
P(
{"id":"alphafold","t":"AlphaFold 2","y":2020,"lane":"science","s":"f","d":"A 50-year grand challenge effectively solved; 200M+ structures released to every biologist on Earth. 2024 Chemistry Nobel — AI-for-science's proof of concept.","deps":["transformer","gnn","equivariance"]},
{"id":"proteinlm","t":"Protein LMs & generative design","y":2022,"lane":"science","s":"a","d":"ESM language models and RFdiffusion: read protein space like text, then write new proteins into it. Design, not just prediction.","deps":["bert","diffusion","alphafold"]},
{"id":"alphafold3","t":"AlphaFold 3 & interactions","y":2024,"lane":"science","s":"a","d":"Complexes, DNA/RNA, ligands via diffusion. Drug-discovery pipelines re-tooled around learned structure.","deps":["alphafold","diffusion","equivariance"]},
{"id":"weather","t":"AI weather (GraphCast→GenCast)","y":2023,"lane":"science","s":"f","d":"Beats physics ensembles at a thousandth of the compute; WeatherNext runs operationally. Forecasting's quiet revolution — a solved-enough success story.","deps":["gnn","diffusion","neuraloperator"]},
{"id":"materials","t":"Materials discovery (GNoME)","y":2023,"lane":"science","s":"a","d":"2.2M predicted crystals, autonomous labs synthesizing candidates — with a live replication debate about how many are truly new. Promise and friction together.","deps":["gnn","bayesopt","equivariance","selfdrivinglab"]},
{"id":"fusion","t":"Plasma & fusion control","y":2022,"lane":"science","s":"a","d":"Deep RL shaping tokamak plasmas (TCV). Control physics by learning — a template for AI in big experimental science.","deps":["a3cppo","pinn","neuraloperator"]},
{"id":"mathai","t":"AI mathematics (IMO gold)","y":2024,"lane":"science","s":"h","d":"AlphaProof's formal RL in Lean and informal LLM reasoning both reached olympiad gold (2024–25). Next stop: research-level conjecture and proof.","deps":["itp","reasoning","alphazero"]},
{"id":"medicine","t":"Medical AI deployment","y":2023,"lane":"science","s":"a","d":"Radiology assist → clinical LLMs (Med-Gemini class). Regulation, liability and workflow — not accuracy — are now the rate limiters. Watson's failure is the syllabus.","deps":["detection","multimodal","watson","unet","oodshift"]},
{"id":"genomics","t":"Genomics models (AlphaGenome, Evo)","y":2025,"lane":"science","s":"a","d":"Long-context models reading regulatory DNA and whole genomes. The genome as a language — the next AlphaFold-shaped bet.","deps":["proteinlm","longctx"]},
{"id":"sciagents","t":"AI co-scientists","y":2025,"lane":"science","s":"h","d":"Agentic hypothesis→literature→experiment pipelines producing first real findings (co-scientist systems, AlphaEvolve results). Reproducibility discipline still forming.","deps":["agentsllm","alphaevolve","selfdrivinglab"]},
{"id":"gap_scilab","t":"General-purpose autonomous scientist","y":2026,"lane":"science","s":"g","d":"Domain-specific self-driving laboratories already close design–execute–learn loops. The open challenge is reliable, reproducible autonomy that forms hypotheses and transfers across instruments, domains and scientific objectives.","deps":["sciagents","rtfm","selfdrivinglab"]}
);
/* ============ 2010–2026 ARXIV EXPANSION ============ */
P(
{"id":"subword","t":"Subword tokenization (BPE → SentencePiece)","y":2015,"lane":"language","s":"f","d":"Open-vocabulary modeling with reusable word pieces made rare words, multilingual translation and modern LLM vocabularies practical. The quiet interface between raw text and neural sequence models.","deps":["seq2seq","word2vec"]},
{"id":"modelleak","t":"Privacy attacks & model leakage","y":2016,"lane":"safety","s":"a","d":"Membership inference and related attacks showed that trained models can reveal whether specific records — and sometimes sensitive attributes — were present. Privacy became an empirical attack surface, not only a training objective.","deps":["dp","alexnet"]},
{"id":"oodshift","t":"Distribution shift & OOD detection","y":2016,"lane":"safety","s":"a","d":"Models can be confidently wrong when deployment data differs from training. Detection baselines, shift benchmarks and robustness methods made this a distinct reliability field rather than an edge case.","deps":["alexnet","stats25"]},
{"id":"imitation","t":"Modern imitation learning (DAgger → GAIL)","y":2011,"lane":"rl","s":"f","d":"DAgger confronted policy-induced distribution shift; GAIL learned behavior by adversarially matching expert demonstrations. Together they formed the modern route from demonstrations to sequential policies.","deps":["alvinn","policygrad"]},
{"id":"continuousrl","t":"Deep continuous control (DDPG → SAC)","y":2015,"lane":"rl","s":"f","d":"Off-policy actor–critic learning extended deep RL from discrete games to continuous actions; maximum-entropy SAC made the recipe substantially more stable for locomotion and manipulation.","deps":["dqn","policygrad"]},
{"id":"mixedprecision","t":"Mixed-precision training","y":2017,"lane":"training","s":"f","d":"Lower-precision arithmetic with loss scaling accelerated training and reduced memory without sacrificing model quality. It became a standard training-systems technique, distinct from inference quantization.","deps":["gpgpu","frameworks"]},
{"id":"vqcodes","t":"Discrete neural representations & codecs","y":2017,"lane":"generative","s":"a","d":"VQ-VAE learned discrete codebooks; VQGAN and neural audio codecs turned images and sound into learned tokens. This lineage connects generative models, compression and multimodal tokenization.","deps":["vae","autoencoders"]},
{"id":"neuralverify","t":"Neural robustness & formal verification","y":2017,"lane":"safety","s":"a","d":"Adversarial training, SMT-based checking and certified defenses test or guarantee bounded neural-network behavior. These are working methods, though far narrower than whole-agent safety proofs.","deps":["advexamples","satsolvers"]},
{"id":"backdoors","t":"Data poisoning & model backdoors","y":2017,"lane":"safety","s":"a","d":"Training-time and supply-chain attacks implant trigger-dependent behavior that can survive ordinary retraining or safety tuning. This is distinct from test-time adversarial examples and prompt injection.","deps":["advexamples","alexnet"]},
{"id":"pinn","t":"Physics-informed neural networks","y":2017,"lane":"science","s":"a","d":"PINNs place differential equations and boundary conditions inside the training objective for forward and inverse problems. They opened a major scientific-ML program while retaining known optimization and scaling limits.","deps":["backprop","stats25"]},
{"id":"equivariance","t":"Equivariant & geometric deep learning","y":2018,"lane":"neural","s":"a","d":"Architectures that respect rotation, translation and other symmetries became foundational for molecular, physical and 3D learning. Built-in geometry improves data efficiency and physical plausibility.","deps":["gnn","cnn89"]},
{"id":"goalmisgen","t":"Inner alignment & goal misgeneralization","y":2019,"lane":"safety","s":"a","d":"A capable learned policy can pursue an unintended objective after distribution shift even when the training reward looked correct. Experiments establish the failure mode, not that every example is a mesa-optimizer.","deps":["concreteproblems","superintbook","dqn","oodshift"]},
{"id":"mlcompiler","t":"ML compilers & tensor/kernel IRs","y":2018,"lane":"systems","s":"f","d":"TVM and MLIR created optimizing layers between model graphs and heterogeneous hardware. Compilation, scheduling and kernel generation became essential parts of ML performance rather than afterthoughts.","deps":["gpgpu","frameworks"]},
{"id":"selfdrivinglab","t":"Self-driving laboratories","y":2019,"lane":"science","s":"a","d":"Domain-specific systems close a design–execute–measure–learn loop with robotics and active learning. They demonstrate real autonomous experimentation without yet providing a general-purpose robot scientist.","deps":["bayesopt","dendral","deeprlrobot"]},
{"id":"denseretrieval","t":"Dense neural retrieval & dual encoders","y":2019,"lane":"language","s":"f","d":"Dual encoders learned semantic query and document spaces, replacing much lexical matching in open-domain QA. Dense retrieval is the missing systems-and-model bridge into retrieval-augmented generation.","deps":["ir","bert","selfsup"]},
{"id":"neuraloperator","t":"Neural operators & learned PDE solvers","y":2019,"lane":"science","s":"a","d":"DeepONet and Fourier Neural Operators learn mappings between functions rather than one fixed discretization. The approach now powers fast surrogate models in weather, fluids and engineering.","deps":["pinn","neuralode"]},
{"id":"speechfm","t":"Speech foundation models (wav2vec 2.0 → Whisper)","y":2020,"lane":"language","s":"f","d":"Self-supervised speech representation learning and weakly supervised web-scale transcription replaced task-specific acoustic pipelines with reusable speech models and robust multilingual transfer.","deps":["selfsup","transformer","dlspeech"]},
{"id":"instructiontune","t":"Instruction tuning","y":2021,"lane":"language","s":"f","d":"Supervised fine-tuning across diverse natural-language tasks taught pretrained models to follow new instructions zero-shot. It is a separate lineage from preference modeling and RLHF.","deps":["transfer","gpt3"]},
{"id":"flowmatching","t":"Flow matching & rectified flow","y":2022,"lane":"generative","s":"h","d":"Continuous-time vector-field learning offers a direct path from noise to data, often with straighter and faster trajectories than diffusion sampling. It is now a major generative-model branch.","deps":["flows","diffusion","neuralode","optimaltransport"]},
{"id":"llmserving","t":"LLM inference & serving systems","y":2022,"lane":"systems","s":"h","d":"Speculative decoding, continuous batching and PagedAttention attack latency, memory fragmentation and throughput. Serving systems are a distinct research layer from model compression.","deps":["transformer","distributed","flash"]},
{"id":"agentbench","t":"Interactive agent benchmarks","y":2023,"lane":"rl","s":"h","d":"WebArena, AgentBench, SWE-bench and OSWorld evaluate stateful execution in websites, repositories and computers. They expose planning and recovery failures that static question-answer benchmarks miss.","deps":["agentsllm","evals"]},
{"id":"visuomotor","t":"Generative visuomotor policies","y":2023,"lane":"robotics","s":"h","d":"ACT predicts temporally chunked actions; Diffusion Policy models multimodal action distributions. These demonstration-driven policy representations bridge classical imitation learning and vision-language-action models.","deps":["imitation","diffusion","deeprlrobot","simenv"]},
{"id":"modelediting","t":"Model editing & activation steering","y":2022,"lane":"safety","s":"h","d":"Targeted weight edits and inference-time activation interventions can change facts or behaviors locally. Reliability, side effects, causal interpretation and generalization remain active limitations.","deps":["interp","transformer"]},
{"id":"aicontrol","t":"AI control protocols","y":2023,"lane":"safety","s":"h","d":"Control research evaluates how trusted monitors, resampling, editing and limited human audits can constrain an intentionally subversive model. It is an active defense–attack program, not a solved safeguard.","deps":["agentsllm","evals","w2s","goalmisgen"]},
{"id":"selfgenagents","t":"Self-generated curricula & self-editing agents","y":2025,"lane":"rl","s":"h","d":"Voyager, Absolute Zero and Darwin Gödel Machine generate tasks, skills or agent modifications and retain measured improvements. Results are promising but bounded by designed environments, verifiers and benchmarks.","deps":["agentsllm","openended","rlvr","alphaevolve"]},
{"id":"maml","t":"Deep meta-learning (MAML)","y":2017,"lane":"training","s":"a","d":"Model-Agnostic Meta-Learning optimized parameters for rapid adaptation from a few examples. It made learning-to-learn concrete, though foundation-model adaptation later changed the center of gravity.","deps":["sgd","hypernet"]},
{"id":"mapelites","t":"Quality-diversity search (MAP-Elites)","y":2015,"lane":"alt","s":"a","d":"Instead of one optimum, MAP-Elites builds an archive of diverse high-performing solutions across behavioral niches. The archive idea feeds evolutionary design and open-ended exploration.","deps":["ga","alife"]},
{"id":"neuralprog","t":"Neural-guided program synthesis","y":2016,"lane":"symbolic","s":"a","d":"DeepCoder and DreamCoder use learned guidance, search and reusable abstractions to synthesize programs from examples. The lineage links symbolic search to modern code generation.","deps":["ilp","seq2seq"]},
{"id":"optimaltransport","t":"Computational optimal transport","y":2013,"lane":"prob","s":"a","d":"Entropic regularization made transport distances computationally practical; Wasserstein objectives then influenced generative modeling, domain adaptation and representation learning.","deps":["stats25"]},
{"id":"nucleus","t":"Nucleus sampling & decoding controls","y":2019,"lane":"language","s":"f","d":"Top-p sampling truncates the unreliable probability tail dynamically, improving open-ended generation. Decoding policy became a consequential layer between model probabilities and visible behavior.","deps":["gpt2"]},
{"id":"unlearning","t":"Machine unlearning","y":2019,"lane":"safety","s":"a","d":"Unlearning asks a trained model to remove the influence of selected data without full retraining. Verification, utility preservation and realistic deletion guarantees remain open research problems.","deps":["dp","modelleak"]},
{"id":"groundedplanning","t":"Language-grounded embodied planning","y":2017,"lane":"robotics","s":"a","d":"Vision-and-language navigation and later SayCan ground language instructions in perception, affordances and executable skills. This is the planning bridge into robot foundation models.","deps":["seq2seq","planningpddl","simenv"]}
);

/* ---------- transform / zoom ---------- */
const stage = document.getElementById('stage');
let tx = 0, ty = 0, k = 1;
let vw = stage.clientWidth, vh = stage.clientHeight;
const FAR_K = 0.34;
let isFar = false, rafPending = false;

function viewInsets(){
  if(vw<=740)return {left:0,right:0};
  const leftPanel=document.getElementById('legend'),rightPanel=document.getElementById('panel');
  const left=leftPanel&&leftPanel.classList.contains('open')?Math.min(vw*.46,leftPanel.getBoundingClientRect().right+12):0;
  const right=rightPanel&&rightPanel.classList.contains('open')?Math.min(vw*.46,vw-rightPanel.getBoundingClientRect().left+12):0;
  return {left,right};
}
function viewCenterX(){const {left,right}=viewInsets();return left+Math.max(160,vw-left-right)/2;}
function clampView(){
  const mx=Math.min(160,vw*.22),my=Math.min(140,vh*.22),{left,right}=viewInsets(),aw=Math.max(160,vw-left-right);
  if(WORLD_W*k>aw)tx=Math.min(left+mx,Math.max(vw-right-WORLD_W*k-mx,tx));
  else tx=left+(aw-WORLD_W*k)/2;
  ty=WORLD_H*k>vh?Math.min(my,Math.max(vh-WORLD_H*k-my,ty)):Math.min(vh-my,Math.max(my-WORLD_H*k,ty));
}
function applyT(){
  clampView();
  if (rafPending) return; rafPending = true;
  requestAnimationFrame(() => {
    rafPending = false;
    world.setAttribute('transform', `translate(${tx},${ty}) scale(${k})`);
    gEdgesAll.style.strokeWidth = Math.max(1, 1.1/k);
    gEdgesHi.style.strokeWidth = Math.max(1.6, 2/k);
    const far = k < FAR_K;
    if (far !== isFar){ isFar = far; svg.classList.toggle('far', far); }
    if (far){ const r = Math.min(30, 6/k); NODES.forEach(nd => nd.el.lastChild.setAttribute('r', r)); }
    updateHud(); drawMiniView();
    document.getElementById('zoomPct').textContent = Math.round(k*100) + '%';
  });
}
function clampK(v){ return Math.min(3.5, Math.max(0.035, v)); }
function zoomAt(px, py, nk){ nk = clampK(nk); tx = px - (px - tx) * (nk/k); ty = py - (py - ty) * (nk/k); k = nk; applyT(); }
function fitRect(x0,y0,x1,y1,pad){
  pad=pad||40;
  const {left,right}=viewInsets(),aw=Math.max(160,vw-left-right);
  const nk=clampK(Math.min((aw-pad)/(x1-x0),(vh-pad)/(y1-y0)));
  tx=left+(aw-(x1-x0)*nk)/2-x0*nk;ty=(vh-(y1-y0)*nk)/2-y0*nk+20;k=nk;applyT();
}
function fitAll(){ fitRect(0,0,WORLD_W,WORLD_H,60); }

stage.addEventListener('wheel', ev => {
  ev.preventDefault();
  const r = stage.getBoundingClientRect();
  const f = Math.exp(-ev.deltaY * (ev.deltaMode === 1 ? 0.05 : 0.0016));
  zoomAt(ev.clientX - r.left, ev.clientY - r.top, k * f);
  scheduleState();
}, {passive:false});

let panning = false, moved = false, px0=0, py0=0, pinchDist=0, pinchCx=0, pinchCy=0;
const activePointers = new Map();
stage.addEventListener('pointerdown', ev => {
  if (ev.pointerType !== 'touch' && ev.button !== 0) return;
  ev.preventDefault();
  activePointers.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  stage.setPointerCapture(ev.pointerId);
  if (activePointers.size === 1){
    panning = true; moved = false; px0 = ev.clientX; py0 = ev.clientY; stage.classList.add('panning');
  } else if (activePointers.size === 2){
    const [a,b] = [...activePointers.values()];
    pinchDist = Math.hypot(a.x-b.x,a.y-b.y); pinchCx=(a.x+b.x)/2; pinchCy=(a.y+b.y)/2; moved=true;
  }
});
stage.addEventListener('pointermove', ev => {
  if (!activePointers.has(ev.pointerId)) return;
  ev.preventDefault();
  activePointers.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if (activePointers.size === 2){
    const [a,b] = [...activePointers.values()];
    const dist=Math.max(1,Math.hypot(a.x-b.x,a.y-b.y)), cx=(a.x+b.x)/2, cy=(a.y+b.y)/2;
    tx += cx-pinchCx; ty += cy-pinchCy;
    zoomAt(cx,cy,k*(dist/Math.max(1,pinchDist)));
    pinchDist=dist; pinchCx=cx; pinchCy=cy; moved=true; return;
  }
  if (!panning) return;
  const dx=ev.clientX-px0, dy=ev.clientY-py0;
  if (Math.abs(dx)+Math.abs(dy)>7) moved=true;
  tx+=dx; ty+=dy; px0=ev.clientX; py0=ev.clientY; applyT();
});
function endPointer(ev){
  if (!activePointers.has(ev.pointerId)) return;
  const wasSingle=activePointers.size===1;
  activePointers.delete(ev.pointerId);
  if (activePointers.size===1){
    const remain=[...activePointers.values()][0]; px0=remain.x; py0=remain.y; panning=true;
  } else if (!activePointers.size){ panning=false; stage.classList.remove('panning'); }
  if (wasSingle && !moved){
    const hit=document.elementFromPoint(ev.clientX,ev.clientY);
    const g=hit&&hit.closest?hit.closest('g.node'):null;
    if (g) select(g.getAttribute('data-id')); else deselect();
  }
  scheduleState();
}
stage.addEventListener('pointerup',endPointer);
stage.addEventListener('pointercancel',endPointer);stage.addEventListener('dblclick', ev => {
  const r = stage.getBoundingClientRect();
  zoomAt(ev.clientX - r.left, ev.clientY - r.top, k * 1.7);
});

const eraHud = document.getElementById('eraHud'), laneHud = document.getElementById('laneHud');
const eraTags = ERAS.map(e => {

function updateHud(){
  let prevR = [-1e9, -1e9];
  ERAS.forEach((e,i) => {
    const sx0 = tx + e.x0*k, sx1 = tx + e.x1*k, d = eraTags[i];
    if (sx1 < 40 || sx0 > vw - 20 || (sx1-sx0) < 60){ d.style.display='none'; return; }
    d.style.display='block';
    const L = Math.max(6, Math.min(sx0 + 8, sx1 - d.offsetWidth - 8));
    let row = L > prevR[0] + 10 ? 0 : (L > prevR[1] + 10 ? 1 : -1);
    if (row === -1){ d.style.display='none'; return; }
    d.style.left = L + 'px'; d.style.top = (4 + row*15) + 'px';
    prevR[row] = L + d.offsetWidth;
  });
  LANES.forEach((ln,i) => {
    const sy0 = ty + ln.y0*k, sy1 = ty + (ln.y0+ln.h)*k, d = laneTags[i];
    if (sy1 < 6 || sy0 > vh - 34 || (sy1-sy0) < 12){ d.style.display='none'; return; }

/* ---------- edges ---------- */
function edgePath(a, b){
  const x1 = a.px + a.w, y1 = a.py + NODE_H/2, x2 = b.px, y2 = b.py + NODE_H/2;
  if (x2 > x1 + 24){
    const dx = Math.max(46, (x2-x1) * 0.42);
    return `M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`;
  }
  const bend = (y2 >= y1 ? 1 : -1) * 46;
  return `M${x1},${y1} C${x1+110},${y1+bend} ${x2-110},${y2-bend} ${x2},${y2}`;
}
let allBuilt = false;
function buildAllEdges(){
  if (allBuilt) return; allBuilt = true;
  const frag = document.createDocumentFragment();
  EDGES.forEach(e => {
    const p = document.createElementNS(NS,'path');
    p.setAttribute('d', edgePath(byId.get(e.a), byId.get(e.b)));
    if (e.t !== 'dep') p.setAttribute('class', e.t);
    frag.appendChild(p);
  });
  gEdgesAll.appendChild(frag);
}

/* ---------- highlight ---------- */
let mode = 'hover';   // off | hover | all

function clearHi(){
  gEdgesHi.innerHTML = '';
  gNodes.classList.remove('hovering');
  gEdgesAll.classList.remove('dimAll');
  gNodes.querySelectorAll('.lit').forEach(n => n.classList.remove('lit'));
}
function drawHi(id, transitive){
  clearHi();
  const litIds = new Set([id]);
  const edgeList = [];
  if (transitive){
    let q = [id];
    while (q.length){ const c = q.shift(); pars.get(c).forEach(e => { edgeList.push({...e, dir:'in'}); if (!litIds.has(e.a)){ litIds.add(e.a); q.push(e.a); } }); }
    q = [id];
    while (q.length){ const c = q.shift(); kids.get(c).forEach(e => { edgeList.push({...e, dir:'out'}); if (!litIds.has(e.b)){ litIds.add(e.b); q.push(e.b); } }); }
  } else {
    pars.get(id).forEach(e => { edgeList.push({...e, dir:'in'}); litIds.add(e.a); });
    kids.get(id).forEach(e => { edgeList.push({...e, dir:'out'}); litIds.add(e.b); });
  }
  const frag = document.createDocumentFragment();
  edgeList.filter(isEdgeVisible).forEach(e => {
    const p = document.createElementNS(NS,'path');
    p.setAttribute('d', edgePath(byId.get(e.a), byId.get(e.b)));
    let cls = e.dir; if (e.t === 'sup') cls = 'sup'; else if (e.t === 'gap') cls = 'gap';
    p.setAttribute('class', cls);
    p.setAttribute('marker-end', `url(#m-${cls === 'sup' ? 'sup' : cls === 'gap' ? 'gap' : e.dir})`);
    frag.appendChild(p);
  });
  gEdgesHi.appendChild(frag);
  litIds.forEach(i => { const nd = byId.get(i); if (nd) nd.el.classList.add('lit'); });
  gNodes.classList.add('hovering');
  if (mode === 'all') gEdgesAll.classList.add('dimAll');
}

function focusNode(id, bringIntoView=true){
  const nd=byId.get(id); if(!nd) return;
  const prev=byId.get(focusId); if(prev) prev.el.setAttribute('tabindex','-1');
  focusId=id; nd.el.setAttribute('tabindex','0'); nd.el.focus();
  if(bringIntoView) flyTo(nd,Math.max(k,.72));
}
function handleNodeKey(ev,nd){
  if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();select(nd.id);flyTo(nd,Math.max(k,.85));return;}
  if(ev.key==='Escape'){ev.preventDefault();deselect();return;}
  const keys=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'];
  if(!keys.includes(ev.key)) return;
  ev.preventDefault();
  const visible=NODES.filter(isNodeVisible);
  let target=null;
  if(ev.key==='Home'||ev.key==='End'){
    const sorted=[...visible].sort((a,b)=>a.px-b.px);
    target=ev.key==='Home'?sorted[0]:sorted[sorted.length-1];
  } else if(ev.key==='ArrowLeft'||ev.key==='ArrowRight'){
    const row=visible.filter(n=>n.lane===nd.lane).sort((a,b)=>a.px-b.px);
    const at=row.indexOf(nd), delta=ev.key==='ArrowLeft'?-1:1;
    target=row[Math.max(0,Math.min(row.length-1,at+delta))];
  } else {
    const laneIndex=LANES.findIndex(l=>l.id===nd.lane), delta=ev.key==='ArrowUp'?-1:1;
    for(let li=laneIndex+delta;li>=0&&li<LANES.length;li+=delta){
      const row=visible.filter(n=>n.lane===LANES[li].id);
      if(row.length){target=row.reduce((best,n)=>Math.abs(n.px-nd.px)<Math.abs(best.px-nd.px)?n:best,row[0]);break;}
    }
  }
  if(target) focusNode(target.id);
}
function select(id){
  const nd = byId.get(id); if(!nd) return;
  let filterChanged=false,auditCleared=false,researchCleared=false;
  if(!activeStatus.has(nd.s)){activeStatus.add(nd.s);filterChanged=true;}
  if(!matchesAuditFilter(nd)){activeAuditFilter='all';auditFilterEl.value='all';filterChanged=true;auditCleared=true;}
  if(!matchesResearchFilter(nd)){activeResearchFilter='all';researchFilterEl.value='all';filterChanged=true;researchCleared=true;}
  if(filterChanged)refreshFilter();
  if(auditCleared||researchCleared)showToast(`${auditCleared?'Evidence':''}${auditCleared&&researchCleared?' and ':''}${researchCleared?'research':''} filter${auditCleared&&researchCleared?'s':''} cleared to show selection`);
  if (selected){ byId.get(selected).el.classList.remove('focus'); byId.get(selected).el.setAttribute('aria-expanded','false'); }
  selected = id; traced = false;
  nd.el.classList.add('focus'); nd.el.setAttribute('aria-expanded','true');
  if (mode !== 'off') drawHi(id, false);
  openPanel(nd);
  const trace=document.getElementById('traceBtn'); trace.classList.remove('on'); trace.setAttribute('aria-pressed','false');
  scheduleState();
}
function deselect(){
  if (!selected) return;
  byId.get(selected).el.classList.remove('focus'); byId.get(selected).el.setAttribute('aria-expanded','false');
  selected = null; traced = false;
  clearHi(); closePanel(); scheduleState();
}

  const tx0 = tx, ty0 = ty, k0 = k, t0 = performance.now();
  cancelAnimationFrame(flyRaf);

function cssVar(name){return getComputedStyle(document.body).getPropertyValue(name).trim();}
function renderMiniBase(){
  const c=miniBase.getContext('2d');c.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);c.clearRect(0,0,MW,MH);
  c.fillStyle=cssVar('--mini-bg');c.fillRect(0,0,MW,MH);
  ERAS.forEach((e,i)=>{if(i%2){c.fillStyle=cssVar('--era-band');c.fillRect(e.x0*msx,0,e.w*msx,MH);}});
  NODES.forEach(nd=>{if(isNodeVisible(nd)){c.fillStyle=STATUS[nd.s].c;c.fillRect(nd.px*msx,nd.py*msy,Math.max(1.6,nd.w*msx),1.7);}});
}
function drawMiniView(){
  mctx.clearRect(0,0,MW,MH);mctx.drawImage(miniBase,0,0,MW,MH);
  const x0=(-tx/k)*msx,y0=(-ty/k)*msy,w=(vw/k)*msx,h=(vh/k)*msy,light=document.body.dataset.theme==='light';
  mctx.strokeStyle=light?'rgba(24,34,53,.75)':'rgba(255,255,255,.75)';mctx.lineWidth=1;
  mctx.strokeRect(x0,y0,Math.min(w,MW),Math.min(h,MH));
  mctx.fillStyle=light?'rgba(24,34,53,.08)':'rgba(255,255,255,.06)';mctx.fillRect(x0,y0,Math.min(w,MW),Math.min(h,MH));
}
function miniJump(ev){
  const r=mini.getBoundingClientRect(),wx=((ev.clientX-r.left)/r.width)*WORLD_W,wy=((ev.clientY-r.top)/r.height)*WORLD_H;
  tx=viewCenterX()-wx*k;ty=vh/2-wy*k;applyT();
}
let miniDown=false;
mini.addEventListener('pointerdown',ev=>{miniDown=true;miniJump(ev);mini.setPointerCapture(ev.pointerId);});
mini.addEventListener('pointermove',ev=>{if(miniDown)miniJump(ev);});
mini.addEventListener('pointerup',()=>{miniDown=false;scheduleState();});
document.getElementById('miniWrap').addEventListener('keydown',ev=>{
  const step=120;
  if(ev.key==='ArrowLeft'){tx+=step;}else if(ev.key==='ArrowRight'){tx-=step;}else if(ev.key==='ArrowUp'){ty+=step;}else if(ev.key==='ArrowDown'){ty-=step;}else return;
  ev.preventDefault();applyT();scheduleState();
});

/* ---------- stats ---------- */
function updateStats(){
  const visible=NODES.filter(isNodeVisible).length;
  document.getElementById('stats').innerHTML=
    `<span><b>${visible}</b> of ${NODES.length} nodes</span><span><b>${EDGES.length}</b> links</span>`+
    Object.entries(STATUS).map(([key,st])=>`<span class="statStatus" style="color:${st.c}">${st.g} <b style="color:${st.c}">${counts[key]||0}</b> ${st.n.toLowerCase()}</span>`).join('')+
    `<span><b>${RESEARCH_SUMMARY.papers}</b> primary papers &middot; <b>${RESEARCH_SUMMARY.guided}</b> guided nodes</span><span><b>${AUDIT_SUMMARY.nodeAssessed}</b> node &middot; <b>${AUDIT_SUMMARY.edgeAssessed}/${AUDIT_SUMMARY.nonGapEdgeTotal}</b> link Wikipedia checks</span><span id="zoomPct">${Math.round(k*100)}%</span>`;
  if(typeof miniBase!=='undefined'){renderMiniBase();drawMiniView();}
}

/* ---------- theme, sharing, and URL state ---------- */
const themeBtn=document.getElementById('themeBtn'),shareBtn=document.getElementById('shareBtn'),toast=document.getElementById('toast');
let stateReady=false,stateTimer=null,toastTimer=null;
function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1800);}
function setTheme(theme,persist=true){
  const next=theme==='light'?'light':'dark';document.body.dataset.theme=next;
  themeBtn.innerHTML=next==='dark'?'&#9728; Light':'&#9790; Dark';
  themeBtn.setAttribute('aria-label',next==='dark'?'Switch to light theme':'Switch to dark theme');themeBtn.setAttribute('aria-pressed',String(next==='light'));
  const themeMeta=document.querySelector('meta[name="theme-color"]');if(themeMeta)themeMeta.content=next==='light'?'#eef2f7':'#0a0d12';
  if(persist){try{localStorage.setItem('ai-tech-tree-theme',next);}catch(_){}}
  renderMiniBase();drawMiniView();scheduleState();
}
themeBtn.onclick=()=>setTheme(document.body.dataset.theme==='dark'?'light':'dark');
function currentParams(){
  const p=new URLSearchParams(),all=Object.keys(STATUS);
  if(activeStatus.size!==all.length)p.set('status',[...activeStatus].sort().join(','));
  if(activeAuditFilter!=='all')p.set('audit',activeAuditFilter);
  if(activeResearchFilter!=='all')p.set('research',activeResearchFilter);
  if(mode!=='hover')p.set('mode',mode);if(selected)p.set('node',selected);
  p.set('cx',((viewCenterX()-tx)/k).toFixed(1));p.set('cy',((vh/2-ty)/k).toFixed(1));p.set('z',k.toFixed(3));p.set('theme',document.body.dataset.theme);
  return p;
}
function serializeState(){if(!stateReady)return;const hash=currentParams().toString();try{history.replaceState(null,'',`#${hash}`);}catch(_){location.hash=hash;}}
function scheduleState(){if(!stateReady)return;clearTimeout(stateTimer);stateTimer=setTimeout(serializeState,220);}
async function copyCurrentLink(){
  serializeState();const value=location.href;
  try{await navigator.clipboard.writeText(value);showToast('View link copied');}
  catch(_){const ta=document.createElement('textarea');ta.value=value;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();showToast(ok?'View link copied':'Copy unavailable');}
}
shareBtn.onclick=copyCurrentLink;
function restoreState(){
  const p=new URLSearchParams(location.hash.replace(/^#/,''));let restored=false;
  const theme=p.get('theme');if(theme)setTheme(theme,false);
  const statuses=p.get('status');if(statuses){setStatuses(statuses.split(','));restored=true;}
  const savedAudit=p.get('audit');if(AUDIT_FILTER_VALUES.has(savedAudit)&&savedAudit!=='all'){activeAuditFilter=savedAudit;auditFilterEl.value=savedAudit;refreshFilter();restored=true;}
  const savedResearch=p.get('research');if(RESEARCH_FILTER_VALUES.has(savedResearch)&&savedResearch!=='all'){activeResearchFilter=savedResearch;researchFilterEl.value=savedResearch;refreshFilter();restored=true;}
  const savedMode=p.get('mode');if(['off','hover','all'].includes(savedMode)){
    mode=savedMode;document.querySelectorAll('#modeSeg button').forEach(b=>{const on=b.dataset.m===mode;b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on));});
    gEdgesAll.style.display=mode==='all'?'':'none';if(mode==='all'){buildAllEdges();refreshFilter();}restored=true;
  }
  const node=p.get('node');if(node&&byId.has(node)){select(node);focusNode(node,false);restored=true;}
  const cx=Number(p.get('cx')),cy=Number(p.get('cy')),z=Number(p.get('z'));
  if(Number.isFinite(cx)&&Number.isFinite(cy)&&Number.isFinite(z)&&z>0){k=clampK(z);tx=viewCenterX()-cx*k;ty=vh/2-cy*k;applyT();restored=true;}
  return restored;
}

/* ---------- boot ---------- */
setTheme(document.body.dataset.theme||'dark',false);
updateStats();
const restored=restoreState();
if(!restored){
  if(shouldShowWelcome()){
    setLegendOpen(true);fitAll();requestAnimationFrame(()=>{const first=legend.querySelector('[data-start]');if(first)first.focus();});
  }else fitAll();
}else setLegendOpen(false);
stateReady=true;applyT();scheduleState();
</script>
</body>
</html>
